services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: church_attendance
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
