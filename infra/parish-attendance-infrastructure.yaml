AWSTemplateFormatVersion: '2010-09-09'
Description: Parish Attendance Cognito and DynamoDB infrastructure

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment. Each environment receives isolated resources.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted-login domain prefix.
  LocalCallbackURL:
    Type: String
    Default: http://localhost:8080/app/
  ApplicationCallbackURL:
    Type: String
    Default: ''
    Description: Lambda Function URL followed by app/, added after the Lambda stack is deployed.

Conditions:
  HasApplicationCallbackURL: !Not [!Equals [!Ref ApplicationCallbackURL, '']]

Resources:
  ParishAttendanceUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'parish-attendance-${Environment}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Welcome to Parish Attendance
          EmailMessage: Your username is {username} and temporary password is {####}.
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: 'OFF'
  ParishAttendanceUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ParishAttendanceUserPool
      ClientName: !Sub 'parish-attendance-${Environment}-web'
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Ref LocalCallbackURL
        - !If [HasApplicationCallbackURL, !Ref ApplicationCallbackURL, !Ref 'AWS::NoValue']
      LogoutURLs:
        - !Ref LocalCallbackURL
        - !If [HasApplicationCallbackURL, !Ref ApplicationCallbackURL, !Ref 'AWS::NoValue']
      PreventUserExistenceErrors: ENABLED
  ParishAttendanceUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref ParishAttendanceUserPool
      Domain: !Ref CognitoDomainPrefix
  ParishAttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'parish-attendance-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PartitionKey
          AttributeType: S
        - AttributeName: SortKey
          AttributeType: S
        - AttributeName: IdLookupPartitionKey
          AttributeType: S
        - AttributeName: IdLookupSortKey
          AttributeType: S
        - AttributeName: UserAccessPartitionKey
          AttributeType: S
        - AttributeName: UserAccessSortKey
          AttributeType: S
        - AttributeName: MassReportPartitionKey
          AttributeType: S
        - AttributeName: MassReportSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: PartitionKey
          KeyType: HASH
        - AttributeName: SortKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: LookupByEntityId
          KeySchema:
            - AttributeName: IdLookupPartitionKey
              KeyType: HASH
            - AttributeName: IdLookupSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AccessByUser
          KeySchema:
            - AttributeName: UserAccessPartitionKey
              KeyType: HASH
            - AttributeName: UserAccessSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AttendanceByMassReport
          KeySchema:
            - AttributeName: MassReportPartitionKey
              KeyType: HASH
            - AttributeName: MassReportSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  TableName:
    Value: !Ref ParishAttendanceTable
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-TableName'
  TableArn:
    Value: !GetAtt ParishAttendanceTable.Arn
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-TableArn'
  CognitoUserPoolId:
    Value: !Ref ParishAttendanceUserPool
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-CognitoUserPoolId'
  CognitoUserPoolArn:
    Value: !GetAtt ParishAttendanceUserPool.Arn
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-CognitoUserPoolArn'
  CognitoClientId:
    Value: !Ref ParishAttendanceUserPoolClient
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-CognitoClientId'
  CognitoDomain:
    Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub 'ParishAttendance-${Environment}-CognitoDomain'
