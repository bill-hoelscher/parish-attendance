<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parish Attendance</title><style>
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:#f4f7fb;
  color:#172033;
  font:15px system-ui,
  -apple-system,
  sans-serif
}
.app{
  min-height:100vh;
  max-width:1100px;
  margin:auto;
  background:#fff;
  border-inline:1px solid #dde5ef
}
header{
  height:70px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e5ebf2
}
.brand{
  font-weight:750;
  color:#123a66;
  font-size:18px
}
.sub,
.muted{
  color:#6b778b;
  font-size:13px
}
.shell{
  display:grid;
  grid-template-columns:205px 1fr;
  min-height:calc(100vh - 70px)
}
nav{
  padding:16px;
  background:#f8faff;
  border-right:1px solid #e5ebf2
}
nav button{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:11px 12px;
  border-radius:7px;
  margin:3px 0;
  font:inherit;
  cursor:pointer
}
nav button.active{
  background:#dceeff;
  color:#104f8c;
  font-weight:700
}
main{
  padding:28px
}
h1{
  margin:0 0 5px;
  font-size:23px
}
.tools{
  display:flex;
  gap:12px;
  align-items:end;
  margin:24px 0 16px;
  flex-wrap:wrap
}
label{
  display:grid;
  gap:5px;
  font-size:12px;
  font-weight:700;
  color:#5b687b
}
select,
input{
  height:37px;
  padding:0 10px;
  border:1px solid #cbd6e4;
  border-radius:6px;
  background:#fff;
  font:inherit;
  color:inherit
}
.primary{
  height:37px;
  border:0;
  border-radius:6px;
  background:#1465a8;
  color:#fff;
  padding:0 16px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}
.service{
  display:grid;
  grid-template-columns:1fr 130px 80px;
  gap:16px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #edf0f5
}
.time{
  font-weight:750
}
.saved{
  font-size:12px;
  color:#27835f;
  text-align:right
}
table{
  border-collapse:collapse;
  width:100%;
  margin-top:5px
}
th{
  text-align:left;
  color:#67758a;
  font-size:12px;
  padding:10px 8px;
  border-bottom:1px solid #dce4ef
}
td{
  padding:14px 8px;
  border-bottom:1px solid #edf0f5
}
.average{
  font-size:21px;
  font-weight:750;
  color:#104f8c
}
.notice{
  display:none;
  margin:14px 0;
  padding:10px 12px;
  border-radius:6px;
  background:#e8f7ee;
  color:#176344
}
.error{
  background:#ffecee;
  color:#9b2630
}
.empty{
  padding:28px 0;
  color:#6b778b
}
@media(max-width:650px){
  header{
    padding:0 18px
  }
  .shell{
    grid-template-columns:1fr
  }
  nav{
    display:flex;
    padding:8px;
    overflow:auto;
    border-right:0;
    border-bottom:1px solid #e5ebf2
  }
  nav button{
    white-space:nowrap
  }
  main{
    padding:22px
  }
  .service{
    grid-template-columns:1fr 90px 55px
  }
}
</style></head>
<body><div class="app"><header><div><div class="brand">Parish Attendance</div><div class="sub" id="parish-name">Select an organization</div></div><div class="muted">Attendance Counter</div></header><div class="shell"><nav><button class="active" data-view="entry">Attendance entry</button><button data-view="report">Mass averages</button></nav><main id="main"></main></div></div><script>
const main=document.querySelector('#main'),name=document.querySelector('#parish-name');let orgs=[],view='entry';const day=new Date().toISOString().slice(0,10);const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!r.ok)throw new Error((await r.json().catch(()=>({error:r.statusText}))).error||r.statusText);return r.status===204?null:r.json()}
function selectHTML(){return `<label>Organization<select id="org"><option value="">Select parish…</option>${orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></label>`}
async function entry(){main.innerHTML=`<h1>Record attendance</h1><p class="muted">Choose a date to pre-fill the scheduled masses.</p><div class="tools">${selectHTML()}<label>Service date<input id="date" type="date" value="${day}"></label><button class="primary" id="load">Load masses</button></div><div id="notice" class="notice"></div><div id="services" class="empty">Choose an organization, then load its scheduled masses.</div>`;wireOrg();document.querySelector('#load').onclick=loadMasses}
function wireOrg(){const e=document.querySelector('#org');e.value=localStorage.org||'';e.onchange=()=>{localStorage.org=e.value;name.textContent=orgs.find(x=>x.id===e.value)?.name||'Select an organization'}}
async function loadMasses(){const org=document.querySelector('#org').value,date=document.querySelector('#date').value;if(!org)return message('Choose an organization.',true);try{const [masses,records]=await Promise.all([api(`/organizations/${org}/scheduled-masses?date=${date}`),api(`/organizations/${org}/attendance?from=${date}&to=${date}`)]);const existing=new Map(records.map(x=>[x.serviceTime,x]));document.querySelector('#services').innerHTML=masses.length?masses.map(m=>{const a=existing.get(m.serviceTime);return `<div class="service" data-t="${m.serviceTime}" data-name="${esc(m.name)}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${m.serviceTime}</div><div class="muted">${esc(m.name)}</div></div><input type="number" min="0" value="${a?.attendanceCount??''}" placeholder="Count"><span class="saved">${a?'Saved':''}</span></div>`}).join('')+`<div class="tools"><button class="primary" id="save">Save attendance</button></div>`:'<div class="empty">No scheduled masses for this date.</div>';const save=document.querySelector('#save');if(save)save.onclick=saveAttendance}catch(e){message(e.message,true)}}
async function saveAttendance(){const org=document.querySelector('#org').value,date=document.querySelector('#date').value,rows=[...document.querySelectorAll('.service')];try{await Promise.all(rows.filter(x=>x.querySelector('input').value!=='').map(x=>api(`/organizations/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:date,serviceTime:x.dataset.t,massName:x.dataset.name,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadMasses()}catch(e){message(e.message,true)}}
async function report(){main.innerHTML=`<h1>Mass attendance averages</h1><p class="muted">Averages include recorded recurring services only.</p><div class="tools">${selectHTML()}<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="run">Run report</button></div><div id="notice" class="notice"></div><div id="results" class="empty">Choose an organization and run the report.</div>`;wireOrg();document.querySelector('#run').onclick=async()=>{const org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);try{const x=await api(`/organizations/${org}/reports/mass-attendance?from=${document.querySelector('#from').value}&to=${document.querySelector('#to').value}`);document.querySelector('#results').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Services</th><th>Average</th><th>Range</th></tr></thead><tbody>${x.map(r=>`<tr><td>${esc(r.massName)}</td><td>${r.servicesCounted}</td><td class="average">${r.averageAttendance}</td><td>${r.lowestAttendance} – ${r.highestAttendance}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No attendance records in this period.</div>'}catch(e){message(e.message,true)}}}
function message(t,bad=false){const n=document.querySelector('#notice');n.textContent=t;n.className='notice '+(bad?'error':'');n.style.display='block'}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;view==='entry'?entry():report()});(async()=>{try{orgs=await api('/organizations');entry()}catch(e){main.innerHTML='<div class="empty">Unable to load organizations. Start the API and create an organization first.</div>'}})();
const adminButton=document.createElement('button');adminButton.textContent='Administration';document.querySelector('nav').append(adminButton);adminButton.onclick=async()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));adminButton.classList.add('active');main.innerHTML=`<h1>Administration</h1><p class="muted">Create parishes and add recurring mass times.</p><div id="notice" class="notice"></div><div class="tools"><label>Parish name<input id="new-org" placeholder="St. Mary Parish"></label><button class="primary" id="create-org">Create organization</button></div><div class="tools">${selectHTML()}<label>Mass name<input id="mass-name" placeholder="Sunday 9:00 AM"></label><label>Day<select id="weekday"><option value="0">Sunday</option><option value="6">Saturday</option></select></label><label>Time<input id="mass-time" type="time" value="09:00"></label><button class="primary" id="add-mass">Add weekly mass</button></div><div id="templates" class="empty">Choose an organization to view its schedule.</div>`;wireOrg();const load=async()=>{const o=document.querySelector('#org').value;if(!o)return;const x=await api(`/organizations/${o}/mass-templates`);document.querySelector('#templates').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Day</th><th>Time</th></tr></thead><tbody>${x.map(m=>`<tr><td>${esc(m.name)}</td><td>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][m.weekday]}</td><td>${m.serviceTime}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No weekly masses have been added.</div>'};document.querySelector('#org').onchange=load;document.querySelector('#create-org').onclick=async()=>{const n=document.querySelector('#new-org').value.trim();if(!n)return message('Enter an organization name.',true);const x=await api('/organizations',{method:'POST',body:JSON.stringify({name:n,timezone:'America/Chicago'})});orgs.push(x);localStorage.org=x.id;message('Organization created.');load()};document.querySelector('#add-mass').onclick=async()=>{const o=document.querySelector('#org').value,n=document.querySelector('#mass-name').value.trim(),t=document.querySelector('#mass-time').value;if(!o||!n||!t)return message('Choose an organization, mass name, and time.',true);await api(`/organizations/${o}/mass-templates`,{method:'POST',body:JSON.stringify({name:n,weekday:+document.querySelector('#weekday').value,serviceTime:t,isActive:true})});message('Weekly mass added.');load()};load()};
</script>

<script>
adminButton.remove();const adminMenu=document.createElement('div');adminMenu.innerHTML='<div style="font-size:11px;font-weight:750;letter-spacing:.05em;color:#718098;margin:18px 12px 5px">ADMINISTRATION</div><button data-admin="organizations">Organizations</button><button data-admin="schedules">Mass schedules</button><button data-admin="users">User access</button>';document.querySelector('nav').append(adminMenu);const adminButtons=[...adminMenu.querySelectorAll('button')];
function adminMenuState(which){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));adminButtons.forEach(x=>x.classList.toggle('active',x.dataset.admin===which))}
async function adminView(which){adminMenuState(which);if(which==='organizations'){main.innerHTML=`<h1>Organizations</h1><p class="muted">System administrators create and manage parishes.</p><div id="notice" class="notice"></div><div class="tools"><label>Parish name<input id="new-org" placeholder="St. Mary Parish"></label><button class="primary" id="create-org">Create organization</button></div><div id="org-list" class="empty"></div>`;document.querySelector('#create-org').onclick=async()=>{const n=document.querySelector('#new-org').value.trim();if(!n)return message('Enter an organization name.',true);try{const x=await api('/organizations',{method:'POST',body:JSON.stringify({name:n,timezone:'America/Chicago'})});orgs.push(x);localStorage.org=x.id;message('Organization created.');renderOrganizations()}catch(e){message(e.message,true)}};renderOrganizations();return}if(which==='schedules'){main.innerHTML=`<h1>Mass schedules</h1><p class="muted">Organization administrators maintain recurring mass times for their parish.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>Mass name<input id="mass-name" placeholder="Sunday 9:00 AM"></label><label>Day<select id="weekday">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label>Time<input id="mass-time" type="time" value="09:00"></label><button class="primary" id="add-mass">Add weekly mass</button></div><div id="templates" class="empty">Choose an organization to view its schedule.</div>`;wireOrg();document.querySelector('#org').onchange=renderSchedules;document.querySelector('#add-mass').onclick=addSchedule;renderSchedules();return}main.innerHTML=`<h1>User access</h1><p class="muted">Organization administrators will manage attendance counters and other organization administrators for their parish.</p><div class="notice" style="display:block">User access is displayed for the demo. Role-based sign-in and user invitations will be connected when authentication is added.</div><table><thead><tr><th>User</th><th>Role</th><th>Organization</th></tr></thead><tbody><tr><td>maria@example.org</td><td>Organization Administrator</td><td>St. Mary Parish</td></tr><tr><td>james@example.org</td><td>Attendance Counter</td><td>St. Mary Parish</td></tr></tbody></table>`}
function renderOrganizations(){document.querySelector('#org-list').innerHTML=orgs.length?`<table><thead><tr><th>Organization</th><th>Timezone</th></tr></thead><tbody>${orgs.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.timezone)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No organizations created.</div>'}
async function renderSchedules(){const o=document.querySelector('#org')?.value;if(!o){document.querySelector('#templates').textContent='Choose an organization to view its schedule.';return}try{const x=await api(`/organizations/${o}/mass-templates`);document.querySelector('#templates').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Day</th><th>Time</th></tr></thead><tbody>${x.map(m=>`<tr><td>${esc(m.name)}</td><td>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][m.weekday]}</td><td>${m.serviceTime}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No weekly masses have been added.</div>'}catch(e){message(e.message,true)}}
async function addSchedule(){const o=document.querySelector('#org').value,n=document.querySelector('#mass-name').value.trim(),t=document.querySelector('#mass-time').value;if(!o||!n||!t)return message('Choose an organization, mass name, and time.',true);try{await api(`/organizations/${o}/mass-templates`,{method:'POST',body:JSON.stringify({name:n,weekday:+document.querySelector('#weekday').value,serviceTime:t,isActive:true})});message('Weekly mass added.');renderSchedules()}catch(e){message(e.message,true)}}adminButtons.forEach(b=>b.onclick=()=>adminView(b.dataset.admin));
</script>

<script>
function iso(d){return d.toISOString().slice(0,10)}function weekStart(v){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()-d.getDay());return iso(d)}function plus(v,n){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
entry=async function(){const start=localStorage.weekStart||weekStart(day);main.innerHTML=`<h1>Weekly attendance ledger</h1><p class="muted">Review or enter attendance for any week—past or present.</p><div class="tools">${selectHTML()}<button class="primary" id="prev">← Previous week</button><label>Week of<input id="week" type="date" value="${start}"></label><button class="primary" id="next">Next week →</button><button class="primary" id="load">Load week</button></div><div id="notice" class="notice"></div><div id="services" class="empty">Choose an organization, then load a week.</div>`;wireOrg();document.querySelector('#prev').onclick=()=>setWeek(plus(document.querySelector('#week').value,-7));document.querySelector('#next').onclick=()=>setWeek(plus(document.querySelector('#week').value,7));document.querySelector('#load').onclick=loadWeek}
function setWeek(v){document.querySelector('#week').value=v;localStorage.weekStart=v;loadWeek()}
async function loadWeek(){const org=document.querySelector('#org').value,start=weekStart(document.querySelector('#week').value),end=plus(start,6);if(!org)return message('Choose an organization.',true);localStorage.weekStart=start;try{const x=await api(`/organizations/${org}/attendance-ledger?from=${start}&to=${end}`);document.querySelector('#services').innerHTML=x.length?x.map(m=>`<div class="service ledger" data-date="${m.serviceDate}" data-t="${m.serviceTime}" data-name="${esc(m.massName)}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${new Date(m.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${m.serviceTime}</div><div class="muted">${esc(m.massName)}</div></div><input type="number" min="0" value="${m.attendanceCount??''}" placeholder="Count"><span class="saved">${m.attendanceCount!==undefined?'Saved':'Missing'}</span></div>`).join('')+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled masses in this week.</div>';const b=document.querySelector('#save-week');if(b)b.onclick=saveWeek}catch(e){message(e.message,true)}}
async function saveWeek(){const org=document.querySelector('#org').value,rows=[...document.querySelectorAll('.ledger')].filter(x=>x.querySelector('input').value!=='');try{await Promise.all(rows.map(x=>api(`/organizations/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:x.dataset.date,serviceTime:x.dataset.t,massName:x.dataset.name,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadWeek()}catch(e){message(e.message,true)}}entry();
</script>

<script>
const detailsButton=document.createElement('button');detailsButton.textContent='Organization details';detailsButton.dataset.admin='details';adminMenu.insertBefore(detailsButton,adminMenu.querySelector('[data-admin="schedules"]'));const baseAdminView=adminView;adminView=async function(which){if(which!=='details')return baseAdminView(which);adminMenuState(which);main.innerHTML=`<h1>Organization details</h1><p class="muted">Update parish contact information, address, and local time zone.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<button class="primary" id="load-details">Load details</button></div><div id="details" class="empty">Choose an organization to edit its details.</div>`;wireOrg();document.querySelector('#load-details').onclick=loadDetails};
async function loadDetails(){const id=document.querySelector('#org').value;if(!id)return message('Choose an organization.',true);try{const o=await api(`/organizations/${id}`);document.querySelector('#details').innerHTML=`<div class="tools"><label>Organization name<input id="d-name" value="${esc(o.name)}"></label><label>Time zone<select id="d-timezone">${['America/Chicago','America/New_York','America/Denver','America/Los_Angeles','America/Phoenix'].map(z=>`<option ${o.timezone===z?'selected':''} value="${z}">${z}</option>`).join('')}</select></label></div><div class="tools"><label>Address<input id="d-address" value="${esc(o.address||'')}" placeholder="Street, city, state, postal code"></label><label>Contact name<input id="d-contact-name" value="${esc(o.contactName||'')}"></label></div><div class="tools"><label>Contact email<input id="d-contact-email" type="email" value="${esc(o.contactEmail||'')}"></label><label>Contact phone<input id="d-contact-phone" type="tel" value="${esc(o.contactPhone||'')}"></label><button class="primary" id="save-details">Save organization</button></div>`;document.querySelector('#save-details').onclick=async()=>{const updated={name:document.querySelector('#d-name').value.trim(),address:document.querySelector('#d-address').value.trim(),contactName:document.querySelector('#d-contact-name').value.trim(),contactEmail:document.querySelector('#d-contact-email').value.trim(),contactPhone:document.querySelector('#d-contact-phone').value.trim(),timezone:document.querySelector('#d-timezone').value};if(!updated.name)return message('Organization name is required.',true);try{const saved=await api(`/organizations/${id}`,{method:'PATCH',body:JSON.stringify(updated)});orgs=orgs.map(x=>x.id===id?saved:x);name.textContent=saved.name;message('Organization details saved.')}catch(e){message(e.message,true)}}}catch(e){message(e.message,true)}}
detailsButton.onclick=()=>adminView('details');
</script>

<script>
const organizationAdminView=adminView;adminView=async function(which){await organizationAdminView(which);if(which==='schedules')specialMassSection()};
async function specialMassSection(){const host=document.createElement('section');host.innerHTML=`<h2 style="margin-top:34px;font-size:18px">Special masses</h2><p class="muted">Add one-time services or cancel a recurring mass for a specific date.</p><div class="tools"><label>Action<select id="special-action"><option value="ADD">Add one-time mass</option><option value="CANCEL">Cancel recurring mass</option></select></label><label>Date<input id="special-date" type="date" value="${day}"></label><label>Time<input id="special-time" type="time" value="16:00"></label><label>Name<input id="special-name" placeholder="Christmas Eve Mass"></label><label id="template-field" style="display:none">Recurring mass<select id="special-template"></select></label><button class="primary" id="save-special">Save special mass</button></div><div id="special-list" class="empty">Choose an organization to view special masses.</div>`;main.append(host);const org=document.querySelector('#org');const action=document.querySelector('#special-action');async function templates(){const id=org.value;if(!id)return [];return api(`/organizations/${id}/mass-templates`)}async function refresh(){const id=org.value;if(!id)return;try{const x=await api(`/organizations/${id}/special-masses`);document.querySelector('#special-list').innerHTML=x.length?`<table><thead><tr><th>Action</th><th>Date</th><th>Time</th><th>Mass</th></tr></thead><tbody>${x.map(s=>`<tr><td>${s.action==='ADD'?'Added':'Canceled'}</td><td>${s.serviceDate}</td><td>${s.serviceTime}</td><td>${esc(s.name)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No special mass changes.</div>'}catch(e){message(e.message,true)}}async function updateAction(){const cancel=action.value==='CANCEL';document.querySelector('#template-field').style.display=cancel?'grid':'none';if(cancel){const x=await templates();document.querySelector('#special-template').innerHTML=x.map(m=>`<option value="${m.id}" data-time="${m.serviceTime}" data-name="${esc(m.name)}">${esc(m.name)} · ${m.serviceTime}</option>`).join('');const first=document.querySelector('#special-template option');if(first){document.querySelector('#special-time').value=first.dataset.time;document.querySelector('#special-name').value=first.dataset.name}}}action.onchange=updateAction;org.addEventListener('change',refresh);document.querySelector('#save-special').onclick=async()=>{const id=org.value;if(!id)return message('Choose an organization.',true);const cancel=action.value==='CANCEL',payload={action:action.value,serviceDate:document.querySelector('#special-date').value,serviceTime:document.querySelector('#special-time').value,name:document.querySelector('#special-name').value.trim()};if(cancel)payload.massTemplateId=document.querySelector('#special-template').value;if(!payload.serviceDate||!payload.serviceTime||!payload.name)return message('Date, time, and name are required.',true);try{await api(`/organizations/${id}/special-masses`,{method:'POST',body:JSON.stringify(payload)});message('Special mass saved.');refresh()}catch(e){message(e.message,true)}};updateAction();refresh()}
</script>

<script>
detailsButton.remove();const previousAdminView=adminView;adminView=async function(which){if(which==='organizations')return organizationList();return previousAdminView(which)};
async function organizationList(){adminMenuState('organizations');main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Organizations</h1><p class="muted">Parishes that use Parish Attendance.</p></div><button class="primary" id="add-organization">+ Add organization</button></div><div id="organization-list" class="empty">Loading organizations…</div>`;document.querySelector('#add-organization').onclick=()=>organizationDetails();try{orgs=await api('/organizations');document.querySelector('#organization-list').innerHTML=orgs.length?`<table><thead><tr><th>Organization</th><th>Address</th><th>Time zone</th><th></th></tr></thead><tbody>${orgs.map(o=>`<tr><td><strong>${esc(o.name)}</strong></td><td>${esc(o.address||'—')}</td><td>${esc(o.timezone)}</td><td><button class="primary" data-org="${o.id}" style="height:31px;padding:0 10px">View details</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No organizations created yet.</div>';document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>organizationDetails(b.dataset.org))}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function organizationDetails(id){adminMenuState('organizations');let o={name:'',address:'',contactName:'',contactEmail:'',contactPhone:'',timezone:'America/Chicago'};if(id){try{o=await api(`/organizations/${id}`)}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}}main.innerHTML=`<h1>${id?'Organization details':'Add organization'}</h1><p class="muted">${id?'Update parish contact information, address, and local time zone.':'Enter the details for the new parish.'}</p><div id="notice" class="notice"></div><div class="tools"><label>Organization name<input id="d-name" value="${esc(o.name)}"></label><label>Time zone<select id="d-timezone">${['America/Chicago','America/New_York','America/Denver','America/Los_Angeles','America/Phoenix'].map(z=>`<option ${o.timezone===z?'selected':''} value="${z}">${z}</option>`).join('')}</select></label></div><div class="tools"><label>Address<input id="d-address" value="${esc(o.address||'')}" placeholder="Street, city, state, postal code"></label><label>Contact name<input id="d-contact-name" value="${esc(o.contactName||'')}"></label></div><div class="tools"><label>Contact email<input id="d-contact-email" type="email" value="${esc(o.contactEmail||'')}"></label><label>Contact phone<input id="d-contact-phone" type="tel" value="${esc(o.contactPhone||'')}"></label></div><div class="tools"><button class="primary" id="save-details">${id?'Save organization':'Create organization'}</button><button id="cancel-details" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div>`;document.querySelector('#cancel-details').onclick=organizationList;document.querySelector('#save-details').onclick=async()=>{const payload={name:document.querySelector('#d-name').value.trim(),address:document.querySelector('#d-address').value.trim(),contactName:document.querySelector('#d-contact-name').value.trim(),contactEmail:document.querySelector('#d-contact-email').value.trim(),contactPhone:document.querySelector('#d-contact-phone').value.trim(),timezone:document.querySelector('#d-timezone').value};if(!payload.name)return message('Organization name is required.',true);try{const saved=await api(id?`/organizations/${id}`:'/organizations',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});localStorage.org=saved.id;name.textContent=saved.name;organizationList()}catch(e){message(e.message,true)}}}
</script>

<script>
organizationList=async function(){adminMenuState('organizations');main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Organizations</h1><p class="muted">Parishes that use Parish Attendance.</p></div><button class="primary" id="add-organization">+ Add organization</button></div><div id="organization-list" class="empty">Loading organizations…</div>`;document.querySelector('#add-organization').onclick=()=>organizationDetails();try{orgs=await api('/organizations');document.querySelector('#organization-list').innerHTML=orgs.length?`<table><thead><tr><th>Organization</th><th>Location</th><th>Time zone</th><th></th></tr></thead><tbody>${orgs.map(o=>`<tr><td><strong>${esc(o.name)}</strong></td><td>${esc([o.city,o.stateProvince].filter(Boolean).join(', ')||o.address||'—')}</td><td>${esc(o.timezone)}</td><td><a href="#" data-org="${o.id}" style="color:#155a9d;font-weight:700;text-decoration:none">View details →</a></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No organizations created yet.</div>';document.querySelectorAll('[data-org]').forEach(b=>b.onclick=e=>{e.preventDefault();organizationDetails(b.dataset.org)})}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
organizationDetails=async function(id){adminMenuState('organizations');let o={name:'',streetAddress:'',city:'',stateProvince:'',postalCode:'',contactName:'',contactEmail:'',contactPhone:'',timezone:'America/Chicago'};if(id){try{o=await api(`/organizations/${id}`)}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}}const field=(label,id,value,type='text')=>`<label style="display:grid;gap:6px;font-size:13px;font-weight:700;color:#59677b">${label}<input id="${id}" type="${type}" value="${esc(value||'')}"></label>`;main.innerHTML=`<h1>${id?'Organization details':'Add organization'}</h1><p class="muted">${id?esc(o.name):'Enter the details for the new parish.'}</p><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="back-orgs" style="padding:10px 0;color:#27364d;text-decoration:none">Organizations</a><span style="padding:10px 0;color:#155a9d;border-bottom:3px solid #176bb0;font-weight:700">Organization details</span></div><div id="notice" class="notice"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px"><div style="grid-column:1/-1">${field('Organization name','d-name',o.name)}</div><div style="grid-column:1/-1">${field('Street address','d-street',o.streetAddress||o.address)}</div>${field('City','d-city',o.city)}${field('State / Province','d-state',o.stateProvince)}${field('Postal code','d-postal',o.postalCode)}<label style="display:grid;gap:6px;font-size:13px;font-weight:700;color:#59677b">Time zone<select id="d-timezone" style="height:37px;border:1px solid #cbd6e4;border-radius:6px;padding:0 10px;font:inherit">${['America/Chicago','America/New_York','America/Denver','America/Los_Angeles','America/Phoenix'].map(z=>`<option ${o.timezone===z?'selected':''} value="${z}">${z}</option>`).join('')}</select></label>${field('Contact name','d-contact-name',o.contactName)}${field('Contact email','d-contact-email',o.contactEmail,'email')}${field('Contact phone','d-contact-phone',o.contactPhone,'tel')}</div><div class="tools"><button class="primary" id="save-details">${id?'Save organization':'Create organization'}</button></div><div class="notice" style="display:block">The time zone controls how the attendance ledger groups service dates and future mass schedules are generated.</div>`;document.querySelector('#back-orgs').onclick=e=>{e.preventDefault();organizationList()};document.querySelector('#save-details').onclick=async()=>{const payload={name:document.querySelector('#d-name').value.trim(),streetAddress:document.querySelector('#d-street').value.trim(),city:document.querySelector('#d-city').value.trim(),stateProvince:document.querySelector('#d-state').value.trim(),postalCode:document.querySelector('#d-postal').value.trim(),contactName:document.querySelector('#d-contact-name').value.trim(),contactEmail:document.querySelector('#d-contact-email').value.trim(),contactPhone:document.querySelector('#d-contact-phone').value.trim(),timezone:document.querySelector('#d-timezone').value};payload.address=[payload.streetAddress,payload.city,payload.stateProvince,payload.postalCode].filter(Boolean).join(', ');if(!payload.name)return message('Organization name is required.',true);try{const saved=await api(id?`/organizations/${id}`:'/organizations',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});localStorage.org=saved.id;name.textContent=saved.name;organizationList()}catch(e){message(e.message,true)}}}
</script>

<script>
const scheduleAdminView=adminView;const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const massName=(d,t)=>`${weekdays[+d]} · ${t}`;adminView=async function(which){if(which!=='schedules')return scheduleAdminView(which);schedulePage()};
function schedulePage(edit){adminMenuState('schedules');main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Recurring mass templates</h1><p class="muted">Mass names are generated automatically from the weekday and time.</p></div><button class="primary" id="add-template">+ Add recurring mass</button></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}</div><div id="template-editor"></div><div id="templates" class="empty">Choose an organization to view its schedule.</div>`;wireOrg();document.querySelector('#org').onchange=renderTemplateList;document.querySelector('#add-template').onclick=()=>templateEditor();renderTemplateList()}
function templateEditor(t){const host=document.querySelector('#template-editor');host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${t?'Edit recurring mass':'Add recurring mass'}</strong><div class="tools"><label>Day<select id="edit-weekday">${weekdays.map((d,i)=>`<option value="${i}" ${t?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Time<input id="edit-time" type="time" value="${t?.serviceTime||'09:00'}"></label><span class="muted" id="inferred-name" style="padding-bottom:9px"></span><button class="primary" id="save-template">${t?'Save changes':'Add mass'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;const update=()=>document.querySelector('#inferred-name').textContent=`Name: ${massName(document.querySelector('#edit-weekday').value,document.querySelector('#edit-time').value)}`;update();document.querySelector('#edit-weekday').onchange=update;document.querySelector('#edit-time').oninput=update;document.querySelector('#cancel-template').onclick=()=>host.innerHTML='';document.querySelector('#save-template').onclick=async()=>{const org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);const payload={name:massName(document.querySelector('#edit-weekday').value,document.querySelector('#edit-time').value),weekday:+document.querySelector('#edit-weekday').value,serviceTime:document.querySelector('#edit-time').value,isActive:t?.isActive??true,activeFrom:t?.activeFrom,activeTo:t?.activeTo};try{await api(t?`/mass-templates/${t.id}`:`/organizations/${org}/mass-templates`,{method:t?'PATCH':'POST',body:JSON.stringify(payload)});host.innerHTML='';message(t?'Mass template updated.':'Recurring mass added.');renderTemplateList()}catch(e){message(e.message,true)}}}
async function renderTemplateList(){const org=document.querySelector('#org')?.value;if(!org){document.querySelector('#templates').textContent='Choose an organization to view its schedule.';return}try{const x=await api(`/organizations/${org}/mass-templates`);document.querySelector('#templates').innerHTML=x.length?`<div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${x.map(t=>`<div style="display:grid;grid-template-columns:1fr 180px;gap:15px;align-items:center;padding:17px 18px;border-bottom:1px solid #e7edf4"><div><strong style="font-size:16px">${massName(t.weekday,t.serviceTime)}</strong><div class="muted">Active weekly</div></div><div><a href="#" data-edit="${t.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete="${t.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a></div></div>`).join('')}</div>`:'<div class="empty">No recurring masses have been added.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.preventDefault();templateEditor(x.find(t=>t.id===b.dataset.edit))});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this recurring mass? Existing attendance history will remain.'))return;try{await api(`/mass-templates/${b.dataset.delete}`,{method:'DELETE'});message('Mass template deleted.');renderTemplateList()}catch(e){message(e.message,true)}})}catch(e){message(e.message,true)}specialMassSection()}
</script>

<script>
const formatScheduleTime=t=>(t||'').slice(0,5);
function schedulePage(section='recurring'){
  adminMenuState('schedules');
  main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Mass schedules</h1><p class="muted">Manage recurring and one-time Masses for your parish.</p></div></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}</div><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="recurring-tab" style="padding:10px 0;color:${section==='recurring'?'#155a9d':'#27364d'};text-decoration:none;${section==='recurring'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Recurring templates</a><a href="#" id="special-tab" style="padding:10px 0;color:${section==='special'?'#155a9d':'#27364d'};text-decoration:none;${section==='special'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Special Masses</a></div><div id="schedule-content"></div>`;
  wireOrg();
  document.querySelector('#org').onchange=()=>schedulePage(section);
  document.querySelector('#recurring-tab').onclick=e=>{e.preventDefault();schedulePage('recurring')};
  document.querySelector('#special-tab').onclick=e=>{e.preventDefault();schedulePage('special')};
  section==='recurring'?renderRecurringSchedule():renderSpecialMasses();
}
function scheduleList(items,render){return items.length?`<div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${items.map(render).join('')}</div>`:''}
function scheduleRow(content,actions){return `<div style="display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:17px 18px;border-bottom:1px solid #e7edf4"><div>${content}</div><div>${actions}</div></div>`}
async function renderRecurringSchedule(){
  const host=document.querySelector('#schedule-content'),org=document.querySelector('#org').value;
  host.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;font-size:19px">Recurring templates</h2><p class="muted">Mass names are inferred from their weekday and time.</p></div><button class="primary" id="add-template">+ Add recurring Mass</button></div><div id="template-editor"></div><div id="templates" class="empty">${org?'Loading recurring Masses…':'Choose an organization to view its schedule.'}</div>`;
  document.querySelector('#add-template').onclick=()=>recurringEditor();
  if(!org)return;
  try { const templates=await api(`/organizations/${org}/mass-templates`);const list=document.querySelector('#templates');list.innerHTML=scheduleList(templates,t=>scheduleRow(`<strong style="font-size:16px">${esc(massName(t.weekday,formatScheduleTime(t.serviceTime)))}</strong><div class="muted">Active weekly</div>`,`<a href="#" data-edit-template="${t.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete-template="${t.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a>`))||'<div class="empty">No recurring Masses have been added.</div>';document.querySelectorAll('[data-edit-template]').forEach(b=>b.onclick=e=>{e.preventDefault();recurringEditor(templates.find(t=>t.id===b.dataset.editTemplate))});document.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this recurring Mass? Existing attendance history will remain.'))return;try{await api(`/mass-templates/${b.dataset.deleteTemplate}`,{method:'DELETE'});message('Recurring Mass deleted.');renderRecurringSchedule()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}
}
function recurringEditor(template){
  const host=document.querySelector('#template-editor');
  host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${template?'Edit recurring Mass':'Add recurring Mass'}</strong><div class="tools"><label>Day<select id="edit-weekday">${weekdays.map((d,i)=>`<option value="${i}" ${template?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Time<input id="edit-time" type="time" value="${formatScheduleTime(template?.serviceTime)||'09:00'}"></label><span class="muted" id="inferred-name" style="padding-bottom:9px"></span><button class="primary" id="save-template">${template?'Save changes':'Add Mass'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;
  const update=()=>document.querySelector('#inferred-name').textContent=`Name: ${massName(document.querySelector('#edit-weekday').value,document.querySelector('#edit-time').value)}`;
  update();document.querySelector('#edit-weekday').onchange=update;document.querySelector('#edit-time').oninput=update;document.querySelector('#cancel-template').onclick=()=>host.innerHTML='';
  document.querySelector('#save-template').onclick=async()=>{const org=document.querySelector('#org').value,time=document.querySelector('#edit-time').value,weekday=+document.querySelector('#edit-weekday').value;if(!org)return message('Choose an organization.',true);const payload={name:massName(weekday,time),weekday,serviceTime:time,isActive:template?.isActive??true,activeFrom:template?.activeFrom,activeTo:template?.activeTo};try{await api(template?`/mass-templates/${template.id}`:`/organizations/${org}/mass-templates`,{method:template?'PATCH':'POST',body:JSON.stringify(payload)});message(template?'Recurring Mass updated.':'Recurring Mass added.');renderRecurringSchedule()}catch(error){message(error.message,true)}};
}
async function renderSpecialMasses(){
  const host=document.querySelector('#schedule-content'),org=document.querySelector('#org').value;
  host.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;font-size:19px">Special Masses</h2><p class="muted">Named one-time Masses for holidays, celebrations, and other exceptions.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" id="add-special">+ Add special Mass</button><button class="primary" id="cancel-recurring" style="background:#fff;color:#155a9d;border:1px solid #b9cee4">Cancel recurring Mass</button></div></div><div id="special-editor"></div><div id="special-list" class="empty">${org?'Loading special Masses…':'Choose an organization to view special Masses.'}</div><div id="cancellation-list"></div>`;
  document.querySelector('#add-special').onclick=()=>specialMassEditor();
  document.querySelector('#cancel-recurring').onclick=()=>recurringCancellationEditor();
  if(!org)return;
  try { const masses=await api(`/organizations/${org}/special-masses`),added=masses.filter(m=>m.action==='ADD'),canceled=masses.filter(m=>m.action==='CANCEL');const list=document.querySelector('#special-list');list.innerHTML=scheduleList(added,m=>scheduleRow(`<strong style="font-size:16px">${esc(m.name)}</strong><div class="muted">${esc(m.serviceDate)} · ${esc(formatScheduleTime(m.serviceTime))}</div>`,`<a href="#" data-edit-special="${m.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete-special="${m.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a>`))||'<div class="empty">No special Masses have been added.</div>';document.querySelectorAll('[data-edit-special]').forEach(b=>b.onclick=e=>{e.preventDefault();specialMassEditor(added.find(m=>m.id===b.dataset.editSpecial))});document.querySelectorAll('[data-delete-special]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this special Mass?'))return;try{await api(`/special-masses/${b.dataset.deleteSpecial}`,{method:'DELETE'});message('Special Mass deleted.');renderSpecialMasses()}catch(error){message(error.message,true)}});renderCancellations(canceled)}catch(error){message(error.message,true)}
}
function specialMassEditor(special){
  const host=document.querySelector('#special-editor');
  host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${special?'Edit special Mass':'Add special Mass'}</strong><div class="tools"><label>Mass name<input id="special-name" value="${esc(special?.name||'')}" placeholder="Christmas Eve Vigil"></label><label>Mass date<input id="special-date" type="date" value="${special?.serviceDate||day}"></label><label>Mass time<input id="special-time" type="time" value="${formatScheduleTime(special?.serviceTime)||'16:00'}"></label><button class="primary" id="save-special">${special?'Save changes':'Add special Mass'}</button><button id="cancel-special" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;
  document.querySelector('#cancel-special').onclick=()=>host.innerHTML='';
  document.querySelector('#save-special').onclick=async()=>{const org=document.querySelector('#org').value,payload={action:'ADD',name:document.querySelector('#special-name').value.trim(),serviceDate:document.querySelector('#special-date').value,serviceTime:document.querySelector('#special-time').value};if(!payload.name||!payload.serviceDate||!payload.serviceTime)return message('Mass name, date, and time are required.',true);try{await api(special?`/special-masses/${special.id}`:`/organizations/${org}/special-masses`,{method:special?'PATCH':'POST',body:JSON.stringify(payload)});message(special?'Special Mass updated.':'Special Mass added.');renderSpecialMasses()}catch(error){message(error.message,true)}};
}
async function recurringCancellationEditor(){
  const host=document.querySelector('#special-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);
  try { const templates=await api(`/organizations/${org}/mass-templates`);host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>Cancel recurring Mass</strong><p class="muted">This removes the selected recurring Mass from the attendance ledger for one date. It does not affect other weeks.</p><div class="tools"><label>Recurring Mass<select id="cancel-template">${templates.map(t=>`<option value="${t.id}" data-name="${esc(massName(t.weekday,formatScheduleTime(t.serviceTime)))}" data-time="${formatScheduleTime(t.serviceTime)}">${esc(massName(t.weekday,formatScheduleTime(t.serviceTime)))}</option>`).join('')}</select></label><label>Date<input id="cancel-date" type="date" value="${day}"></label><button class="primary" id="save-cancellation">Cancel Mass</button><button id="cancel-cancellation" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Close</button></div></div>`;if(!templates.length){host.innerHTML='<div class="empty">Add a recurring Mass before creating a cancellation.</div>';return}document.querySelector('#cancel-cancellation').onclick=()=>host.innerHTML='';document.querySelector('#save-cancellation').onclick=async()=>{const option=document.querySelector('#cancel-template').selectedOptions[0],payload={action:'CANCEL',massTemplateId:option.value,name:option.dataset.name,serviceDate:document.querySelector('#cancel-date').value,serviceTime:option.dataset.time};try{await api(`/organizations/${org}/special-masses`,{method:'POST',body:JSON.stringify(payload)});message('Recurring Mass canceled for the selected date.');renderSpecialMasses()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
function renderCancellations(canceled){const host=document.querySelector('#cancellation-list');if(!canceled.length){host.innerHTML='';return}host.innerHTML=`<h3 style="margin:30px 0 8px;font-size:16px">Recurring Mass cancellations</h3><p class="muted">These date-specific exceptions hide a recurring Mass without changing the weekly template.</p>${scheduleList(canceled,m=>scheduleRow(`<strong>${esc(m.name)}</strong><div class="muted">Canceled on ${esc(m.serviceDate)} · ${esc(formatScheduleTime(m.serviceTime))}</div>`,`<a href="#" data-delete-cancellation="${m.id}" style="color:#a22b34;font-weight:700;text-decoration:none">Remove cancellation</a>`))}`;document.querySelectorAll('[data-delete-cancellation]').forEach(b=>b.onclick=async e=>{e.preventDefault();try{await api(`/special-masses/${b.dataset.deleteCancellation}`,{method:'DELETE'});message('Recurring Mass restored for that date.');renderSpecialMasses()}catch(error){message(error.message,true)}})}
</script>

<script>
async function loadMassNameOptions(organizationID, selectedID){
  const names=await api(`/organizations/${organizationID}/mass-names`);
  return names.filter(n=>n.isActive||n.id===selectedID);
}
function massNameSelect(names, selectedID, id='mass-name-id'){
  return `<label>Mass name<select id="${id}">${names.map(n=>`<option value="${n.id}" data-name="${esc(n.name)}" ${n.id===selectedID?'selected':''}>${esc(n.name)}${n.isActive?'':' (retired)'}</option>`).join('')}</select></label>`;
}
function schedulePage(section='recurring'){
  adminMenuState('schedules');
  main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Mass schedules</h1><p class="muted">Manage recurring and one-time Masses for your parish.</p></div><button id="manage-mass-names" style="height:37px;border:1px solid #b9cee4;background:#fff;color:#155a9d;border-radius:6px;padding:0 14px;font:inherit;font-weight:700">Manage Mass names</button></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}</div><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="recurring-tab" style="padding:10px 0;color:${section==='recurring'?'#155a9d':'#27364d'};text-decoration:none;${section==='recurring'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Recurring templates</a><a href="#" id="special-tab" style="padding:10px 0;color:${section==='special'?'#155a9d':'#27364d'};text-decoration:none;${section==='special'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Special Masses</a></div><div id="schedule-content"></div>`;
  wireOrg();document.querySelector('#org').onchange=()=>schedulePage(section);document.querySelector('#manage-mass-names').onclick=massNamesPage;document.querySelector('#recurring-tab').onclick=e=>{e.preventDefault();schedulePage('recurring')};document.querySelector('#special-tab').onclick=e=>{e.preventDefault();schedulePage('special')};section==='recurring'?renderRecurringSchedule():renderSpecialMasses();
}
async function recurringEditor(template){
  const host=document.querySelector('#template-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);
  try { const names=await loadMassNameOptions(org,template?.massNameId);if(!names.length){host.innerHTML='<div class="empty">Create a Mass name before adding a recurring Mass.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${template?'Edit recurring Mass':'Add recurring Mass'}</strong><div class="tools">${massNameSelect(names,template?.massNameId)}<label>Day<select id="edit-weekday">${weekdays.map((d,i)=>`<option value="${i}" ${template?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Time<input id="edit-time" type="time" value="${formatScheduleTime(template?.serviceTime)||'09:00'}"></label><button class="primary" id="save-template">${template?'Save changes':'Add Mass'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;document.querySelector('#cancel-template').onclick=()=>host.innerHTML='';document.querySelector('#save-template').onclick=async()=>{const option=document.querySelector('#mass-name-id').selectedOptions[0],time=document.querySelector('#edit-time').value,weekday=+document.querySelector('#edit-weekday').value,payload={massNameId:option.value,name:option.dataset.name,weekday,serviceTime:time,isActive:template?.isActive??true,activeFrom:template?.activeFrom,activeTo:template?.activeTo};try{await api(template?`/mass-templates/${template.id}`:`/organizations/${org}/mass-templates`,{method:template?'PATCH':'POST',body:JSON.stringify(payload)});message(template?'Recurring Mass updated.':'Recurring Mass added.');renderRecurringSchedule()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function specialMassEditor(special){
  const host=document.querySelector('#special-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);
  try { const names=await loadMassNameOptions(org,special?.massNameId);if(!names.length){host.innerHTML='<div class="empty">Create a Mass name before adding a special Mass.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${special?'Edit special Mass':'Add special Mass'}</strong><div class="tools">${massNameSelect(names,special?.massNameId)}<label>Mass date<input id="special-date" type="date" value="${special?.serviceDate||day}"></label><label>Mass time<input id="special-time" type="time" value="${formatScheduleTime(special?.serviceTime)||'16:00'}"></label><button class="primary" id="save-special">${special?'Save changes':'Add special Mass'}</button><button id="cancel-special" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;document.querySelector('#cancel-special').onclick=()=>host.innerHTML='';document.querySelector('#save-special').onclick=async()=>{const option=document.querySelector('#mass-name-id').selectedOptions[0],payload={action:'ADD',massNameId:option.value,name:option.dataset.name,serviceDate:document.querySelector('#special-date').value,serviceTime:document.querySelector('#special-time').value};try{await api(special?`/special-masses/${special.id}`:`/organizations/${org}/special-masses`,{method:special?'PATCH':'POST',body:JSON.stringify(payload)});message(special?'Special Mass updated.':'Special Mass added.');renderSpecialMasses()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function recurringCancellationEditor(){
  const host=document.querySelector('#special-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);try { const templates=await api(`/organizations/${org}/mass-templates`);if(!templates.length){host.innerHTML='<div class="empty">Add a recurring Mass before creating a cancellation.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>Cancel recurring Mass</strong><p class="muted">This removes the selected recurring Mass from the attendance ledger for one date. It does not affect other weeks.</p><div class="tools"><label>Recurring Mass<select id="cancel-template">${templates.map(t=>`<option value="${t.id}" data-name="${esc(t.name)}" data-time="${formatScheduleTime(t.serviceTime)}" data-mass-name-id="${t.massNameId}">${esc(t.name)} · ${formatScheduleTime(t.serviceTime)}</option>`).join('')}</select></label><label>Date<input id="cancel-date" type="date" value="${day}"></label><button class="primary" id="save-cancellation">Cancel Mass</button><button id="cancel-cancellation" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Close</button></div></div>`;document.querySelector('#cancel-cancellation').onclick=()=>host.innerHTML='';document.querySelector('#save-cancellation').onclick=async()=>{const option=document.querySelector('#cancel-template').selectedOptions[0],payload={action:'CANCEL',massTemplateId:option.value,massNameId:option.dataset.massNameId,name:option.dataset.name,serviceDate:document.querySelector('#cancel-date').value,serviceTime:option.dataset.time};try{await api(`/organizations/${org}/special-masses`,{method:'POST',body:JSON.stringify(payload)});message('Recurring Mass canceled for the selected date.');renderSpecialMasses()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function massNamesPage(){
  adminMenuState('schedules');main.innerHTML=`<h1>Mass names</h1><p class="muted">Use the same Mass name for recurring and special Masses to keep reporting consistent across years.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>New Mass name<input id="new-mass-name" placeholder="Christmas Eve Vigil"></label><button class="primary" id="add-mass-name">Add Mass name</button><button id="back-to-schedules" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Back to schedules</button></div><div id="mass-name-list" class="empty">Choose an organization to manage Mass names.</div>`;wireOrg();document.querySelector('#org').onchange=renderMassNames;document.querySelector('#back-to-schedules').onclick=()=>schedulePage('recurring');document.querySelector('#add-mass-name').onclick=async()=>{const org=document.querySelector('#org').value,name=document.querySelector('#new-mass-name').value.trim();if(!org||!name)return message('Choose an organization and enter a Mass name.',true);try{await api(`/organizations/${org}/mass-names`,{method:'POST',body:JSON.stringify({name,isActive:true})});document.querySelector('#new-mass-name').value='';message('Mass name added.');renderMassNames()}catch(error){message(error.message,true)}};renderMassNames();
}
async function renderMassNames(){const org=document.querySelector('#org').value,host=document.querySelector('#mass-name-list');if(!org){host.textContent='Choose an organization to manage Mass names.';return}try{const names=await api(`/organizations/${org}/mass-names`);host.innerHTML=scheduleList(names,n=>scheduleRow(`<label style="display:block">Mass name<input data-name-input="${n.id}" value="${esc(n.name)}" style="margin-top:6px;min-width:260px"></label><div class="muted">${n.isActive?'Available for schedules':'Retired — retained for reporting'}</div>`,`<a href="#" data-save-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Save</a><a href="#" data-toggle-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none;margin-left:16px">${n.isActive?'Retire':'Restore'}</a>`))||'<div class="empty">No Mass names have been created.</div>';document.querySelectorAll('[data-save-name]').forEach(b=>b.onclick=async e=>{e.preventDefault();const n=names.find(n=>n.id===b.dataset.saveName),value=document.querySelector(`[data-name-input="${n.id}"]`).value.trim();if(!value)return message('Mass name is required.',true);try{await api(`/mass-names/${n.id}`,{method:'PATCH',body:JSON.stringify({name:value,isActive:n.isActive})});message('Mass name saved.');renderMassNames()}catch(error){message(error.message,true)}});document.querySelectorAll('[data-toggle-name]').forEach(b=>b.onclick=async e=>{e.preventDefault();const n=names.find(n=>n.id===b.dataset.toggleName);try{await api(`/mass-names/${n.id}`,{method:'PATCH',body:JSON.stringify({name:n.name,isActive:!n.isActive})});message(n.isActive?'Mass name retired.':'Mass name restored.');renderMassNames()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}}
async function report(){main.innerHTML=`<h1>Mass attendance averages</h1><p class="muted">Averages include recurring and special Masses with recorded attendance.</p><div class="tools">${selectHTML()}<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="run">Run report</button></div><div id="notice" class="notice"></div><div id="results" class="empty">Choose an organization and run the report.</div>`;wireOrg();document.querySelector('#run').onclick=async()=>{const org=document.querySelector('#org').value;if(!org)return message('Choose an organization.',true);try{const x=await api(`/organizations/${org}/reports/mass-attendance?from=${document.querySelector('#from').value}&to=${document.querySelector('#to').value}`);document.querySelector('#results').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Services</th><th>Average</th><th>Range</th></tr></thead><tbody>${x.map(r=>`<tr><td>${esc(r.massName)}</td><td>${r.servicesCounted}</td><td class="average">${r.averageAttendance}</td><td>${r.lowestAttendance} – ${r.highestAttendance}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No attendance records in this period.</div>'}catch(error){message(error.message,true)}}}
</script>

<script>
async function loadWeek(){const org=document.querySelector('#org').value,start=weekStart(document.querySelector('#week').value),end=plus(start,6);if(!org)return message('Choose an organization.',true);localStorage.weekStart=start;try{const x=await api(`/organizations/${org}/attendance-ledger?from=${start}&to=${end}`);document.querySelector('#services').innerHTML=x.length?x.map(m=>`<div class="service ledger" data-date="${m.serviceDate}" data-t="${m.serviceTime}" data-name="${esc(m.massName)}" data-mass-name="${m.massNameId||''}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${new Date(m.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${m.serviceTime}</div><div class="muted">${esc(m.massName)}</div></div><input type="number" min="0" value="${m.attendanceCount??''}" placeholder="Count"><span class="saved">${m.attendanceCount!==undefined?'Saved':'Missing'}</span></div>`).join('')+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled masses in this week.</div>';const b=document.querySelector('#save-week');if(b)b.onclick=saveWeek}catch(error){message(error.message,true)}}
async function saveWeek(){const org=document.querySelector('#org').value,rows=[...document.querySelectorAll('.ledger')].filter(x=>x.querySelector('input').value!=='');try{await Promise.all(rows.map(x=>api(`/organizations/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:x.dataset.date,serviceTime:x.dataset.t,massName:x.dataset.name,massNameId:x.dataset.massName||undefined,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadWeek()}catch(error){message(error.message,true)}}
</script>

<script>
async function renderRecurringSchedule(){
  const host=document.querySelector('#schedule-content'),org=document.querySelector('#org').value;
  host.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;font-size:19px">Recurring templates</h2><p class="muted">Choose a Mass name, then set the weekday and time for each recurring service.</p></div><button class="primary" id="add-template">+ Add recurring Mass</button></div><div id="template-editor"></div><div id="templates" class="empty">${org?'Loading recurring Masses…':'Choose an organization to view its schedule.'}</div>`;
  document.querySelector('#add-template').onclick=()=>recurringEditor();
  if(!org)return;
  try { const templates=await api(`/organizations/${org}/mass-templates`),list=document.querySelector('#templates');list.innerHTML=scheduleList(templates,t=>scheduleRow(`<strong style="font-size:16px">${esc(t.name)}</strong><div class="muted">${weekdays[t.weekday]} · ${formatScheduleTime(t.serviceTime)} · Active weekly</div>`,`<a href="#" data-edit-template="${t.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete-template="${t.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a>`))||'<div class="empty">No recurring Masses have been added.</div>';document.querySelectorAll('[data-edit-template]').forEach(b=>b.onclick=e=>{e.preventDefault();recurringEditor(templates.find(t=>t.id===b.dataset.editTemplate))});document.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this recurring Mass? Existing attendance history will remain.'))return;try{await api(`/mass-templates/${b.dataset.deleteTemplate}`,{method:'DELETE'});message('Recurring Mass deleted.');renderRecurringSchedule()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}
}
</script>

<script>

<script>
function ampmParts(time){const [rawHour='0',rawMinute='00']=(time||'00:00').split(':');const hour=Number(rawHour),minute=Number(rawMinute);return {hour:hour%12||12,minute:String(minute).padStart(2,'0'),meridiem:hour>=12?'PM':'AM'}}
function displayTime(time){const value=ampmParts(time);return `${value.hour}:${value.minute} ${value.meridiem}`}
function timePicker(id,time){const value=ampmParts(time);return `<label>Time<span style="display:flex;gap:5px"><select id="${id}-hour">${Array.from({length:12},(_,i)=>i+1).map(hour=>`<option value="${hour}" ${hour===value.hour?'selected':''}>${hour}</option>`).join('')}</select><select id="${id}-minute">${Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(minute=>`<option value="${minute}" ${minute===value.minute?'selected':''}>${minute}</option>`).join('')}</select><select id="${id}-ampm"><option ${value.meridiem==='AM'?'selected':''}>AM</option><option ${value.meridiem==='PM'?'selected':''}>PM</option></select></span></label>`}
function selectedTime(id){let hour=Number(document.querySelector(`#${id}-hour`).value),minute=document.querySelector(`#${id}-minute`).value,meridiem=document.querySelector(`#${id}-ampm`).value;if(meridiem==='AM'&&hour===12)hour=0;if(meridiem==='PM'&&hour!==12)hour+=12;return `${String(hour).padStart(2,'0')}:${minute}`}

<script>
function reportChart(entries){if(!entries.length)return '<div class="empty">No attendance entries for this Mass.</div>';const counts=entries.map(entry=>entry.attendanceCount),minimum=Math.min(...counts),maximum=Math.max(...counts),width=620,height=176,left=40,right=16,top=25,bottom=33,plotWidth=width-left-right,plotHeight=height-top-bottom,point=(entry,index)=>{const x=left+(entries.length===1?plotWidth/2:index*plotWidth/(entries.length-1)),y=top+plotHeight-(entry.attendanceCount-minimum)/Math.max(1,maximum-minimum)*plotHeight;return{x,y}};const points=entries.map(point).map(p=>`${p.x},${p.y}`).join(' ');return `<svg viewBox="0 0 ${width} ${height}" style="display:block;width:100%;max-width:620px;height:auto;margin-top:16px" role="img" aria-label="Attendance trend"><line x1="${left}" y1="${top+plotHeight}" x2="${width-right}" y2="${top+plotHeight}" stroke="#b9c8d8"/><line x1="${left}" y1="${top}" x2="${left}" y2="${top+plotHeight}" stroke="#b9c8d8"/><polyline points="${points}" fill="none" stroke="#176bb0" stroke-width="3"/>${entries.map((entry,index)=>{const p=point(entry,index);return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#176bb0"/><text x="${p.x}" y="${p.y-9}" text-anchor="middle" font-size="11" fill="#17233a">${entry.attendanceCount}</text><text x="${p.x}" y="${height-10}" text-anchor="middle" font-size="10" fill="#5f7189">${displayDate(entry.serviceDate)}</text>`}).join('')}</svg>`}
function reportDetailMarkup(item,entries){return `<div style="border:1px solid #c5dbef;border-radius:10px;background:#fbfdff;padding:20px;margin-top:20px"><div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;font-size:19px">${esc(item.massName)}</h2><p class="muted" style="margin:5px 0 0">${entries.length} recorded service${entries.length===1?'':'s'}</p></div><div style="text-align:right"><strong style="font-size:22px;color:#1766a8">${item.averageAttendance}</strong><div class="muted">average attendance</div></div></div>${reportChart(entries)}<table><thead><tr><th>Service date</th><th>Time</th><th>Attendance</th></tr></thead><tbody>${entries.map(entry=>`<tr><td>${displayDate(entry.serviceDate)}</td><td>${displayTime(entry.serviceTime)}</td><td>${entry.attendanceCount}</td></tr>`).join('')}</tbody></table></div>`}
function reportView(type){const special=type==='special',title=special?'Special Masses':'Recurring Masses';main.innerHTML=`<h1>${title} report</h1><p class="muted">${special?'All special Masses with recorded attendance. Select a row to see its service history.':'Select a recurring Mass to see its service history and attendance trend.'}</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}${special?'':`<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="load-report">Load report</button>`}</div><div id="report-list" class="empty">Choose an organization to view the report.</div><div id="report-details"></div>`;wireOrg();const load=()=>loadReportList(type);document.querySelector('#org').onchange=load;if(!special)document.querySelector('#load-report').onclick=load;if(special&&document.querySelector('#org').value)load()}

async function rolesPage(){adminMenuState('roles');let roles=[];try{roles=await api('/roles')}catch(error){main.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Roles</h1><p class="muted">Choose the permissions for organization-scoped roles. System Administrator is built in and locked.</p></div><button class="primary" id="add-role">Add</button></div><div id="notice" class="notice"></div><div style="display:grid;grid-template-columns:250px 1fr;gap:24px;margin-top:22px"><div id="roles-list"></div><div id="role-editor" class="empty">Select a role.</div></div>`;const renderList=()=>{document.querySelector('#roles-list').innerHTML=roles.map(role=>`<a href="#" data-role-id="${role.id}" style="display:block;padding:13px 14px;margin:5px 0;border:1px solid #dce5ef;border-radius:8px;text-decoration:none;color:#27364d"><strong>${esc(role.name)}${role.isSystem?' · Locked':''}</strong><span class="muted" style="display:block;margin-top:3px">${role.assignmentCount} assigned user${role.assignmentCount===1?'':'s'}</span></a>`).join('')||'<div class="empty">No roles created.</div>';document.querySelectorAll('[data-role-id]').forEach(link=>link.onclick=event=>{event.preventDefault();roleEditor(roles.find(role=>role.id===link.dataset.roleId))})};const roleEditor=role=>{const host=document.querySelector('#role-editor'),system=role.isSystem,permissionSet=new Set(role.permissions);host.innerHTML=`<h2 style="margin:0 0 5px">${system?'System Administrator':role.id?'Edit role':'Add role'}</h2><p class="muted" style="margin-bottom:18px">${system?'This built-in role has full application access and cannot be changed.':'Roles apply within their assigned organization.'}</p><div style="display:grid;gap:16px;max-width:620px"><label>Role name<input id="role-name" value="${esc(role.name||'')}" ${system?'disabled':''}></label><div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${Object.entries(permissionLabels).map(([permission,label])=>`<label style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #e7edf4;font-size:15px;color:#27364d">${label}<input type="checkbox" data-permission="${permission}" ${permissionSet.has(permission)?'checked':''} ${system?'disabled':''}></label>`).join('')}</div><div class="tools">${system?'':`<button class="primary" id="save-role">Save role</button>${role.id?`<button id="delete-role" style="height:37px;border:1px solid #c4696e;background:#fff;color:#9d3039;border-radius:6px;padding:0 14px;font:inherit">Delete</button>`:''}`}</div></div>`;if(system)return;markRequiredFields('#role-name');document.querySelector('#save-role').onclick=async()=>{const payload={name:document.querySelector('#role-name').value.trim(),permissions:[...document.querySelectorAll('[data-permission]:checked')].map(input=>input.dataset.permission)};if(!payload.name)return message('Role name is required.',true);try{const saved=await api(role.id?`/roles/${role.id}`:'/roles',{method:role.id?'PATCH':'POST',body:JSON.stringify(payload)});if(role.id)roles=roles.map(item=>item.id===saved.id?saved:item);else roles.push(saved);renderList();roleEditor(saved)}catch(error){message(error.message,true)}};const deleteButton=document.querySelector('#delete-role');if(deleteButton)deleteButton.onclick=async()=>{if(role.assignmentCount>0)return message('Reassign or remove users before deleting this role.',true);if(!confirm('Delete this role?'))return;try{await api(`/roles/${role.id}`,{method:'DELETE'});roles=roles.filter(item=>item.id!==role.id);renderList();document.querySelector('#role-editor').innerHTML='<div class="empty">Select a role.</div>'}catch(error){message(error.message,true)}}};document.querySelector('#add-role').onclick=()=>roleEditor({name:'',permissions:[],assignmentCount:0});renderList();if(roles.length)roleEditor(roles[0])}
