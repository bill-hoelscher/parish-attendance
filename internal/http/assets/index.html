<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parish Attendance</title><style>
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:#f4f7fb;
  color:#172033;
  font:15px system-ui,
  -apple-system,
  sans-serif
}
.app{
  min-height:100vh;
  max-width:1100px;
  margin:auto;
  background:#fff;
  border-inline:1px solid #dde5ef
}
header{
  height:70px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e5ebf2
}
.brand{
  font-weight:750;
  color:#123a66;
  font-size:18px
}
.sub,
.muted{
  color:#6b778b;
  font-size:13px
}
.parish-context{
  min-height:54px;
  padding:10px 28px;
  display:flex;
  align-items:center;
  gap:18px;
  background:#f8faff;
  border-bottom:1px solid #e5ebf2
}
.shell{
  display:grid;
  grid-template-columns:205px 1fr;
  min-height:calc(100vh - 124px)
}
.shell.parish-choice{
  grid-template-columns:1fr
}
nav{
  padding:16px;
  background:#f8faff;
  border-right:1px solid #e5ebf2
}
nav button{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:11px 12px;
  border-radius:7px;
  margin:3px 0;
  font:inherit;
  cursor:pointer
}
nav button.active{
  background:#dceeff;
  color:#104f8c;
  font-weight:700
}
main{
  padding:28px
}
h1{
  margin:0 0 5px;
  font-size:23px
}
.tools{
  display:flex;
  gap:12px;
  align-items:end;
  margin:24px 0 16px;
  flex-wrap:wrap
}
label{
  display:grid;
  gap:5px;
  font-size:12px;
  font-weight:700;
  color:#5b687b
}
select,
input{
  height:37px;
  padding:0 10px;
  border:1px solid #cbd6e4;
  border-radius:6px;
  background:#fff;
  font:inherit;
  color:inherit
}
.primary{
  height:37px;
  border:0;
  border-radius:6px;
  background:#1465a8;
  color:#fff;
  padding:0 16px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}
.service{
  display:grid;
  grid-template-columns:1fr 130px 80px;
  gap:16px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #edf0f5
}
.time{
  font-weight:750
}
.saved{
  font-size:12px;
  color:#27835f;
  text-align:right
}
table{
  border-collapse:collapse;
  width:100%;
  margin-top:5px
}
th{
  text-align:left;
  color:#67758a;
  font-size:12px;
  padding:10px 8px;
  border-bottom:1px solid #dce4ef
}
td{
  padding:14px 8px;
  border-bottom:1px solid #edf0f5
}
.average{
  font-size:21px;
  font-weight:750;
  color:#104f8c
}
.notice{
  display:none;
  margin:14px 0;
  padding:10px 12px;
  border-radius:6px;
  background:#e8f7ee;
  color:#176344
}
.error{
  background:#ffecee;
  color:#9b2630
}
.empty{
  padding:28px 0;
  color:#6b778b
}
@media(max-width:650px){
  header{
    padding:0 18px
  }
  .shell{
    grid-template-columns:1fr
  }
  nav{
    display:flex;
    padding:8px;
    overflow:auto;
    border-right:0;
    border-bottom:1px solid #e5ebf2
  }
  nav button{
    white-space:nowrap
  }
  main{
    padding:22px
  }
  .service{
    grid-template-columns:1fr 90px 55px
  }
}
</style><style>
#auth-portal{display:none}body.signed-out{background:#082b49}body.signed-out .app{display:none}body.signed-out #auth-portal{display:block;min-height:100vh;color:#f7fbff;background:linear-gradient(120deg,#082b49 0%,#0d3c60 51%,#236982 100%);font-family:system-ui,-apple-system,sans-serif}#auth-portal *{box-sizing:border-box}#auth-portal:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 13% 2%,rgba(244,205,117,.22),transparent 27%),radial-gradient(ellipse at 89% 99%,rgba(99,193,201,.18),transparent 30%);pointer-events:none}.auth-nav{height:76px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;position:relative;border-bottom:1px solid rgba(237,249,255,.15)}.auth-wordmark{display:flex;gap:11px;align-items:center;font-weight:700;letter-spacing:-.02em}.auth-symbol{width:34px;height:34px;border:1px solid rgba(255,255,255,.48);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:19px;color:#f9d883}.auth-support{font-size:12px;color:#bcd5e5}.auth-content{position:relative;max-width:1000px;margin:0 auto;padding:88px 42px 42px;display:grid;grid-template-columns:1.3fr .75fr;gap:72px;align-items:center}.auth-eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:#f8d984}.auth-title{font-family:Georgia,'Times New Roman',serif;font-size:50px;font-weight:400;line-height:1.06;letter-spacing:-.04em;margin:13px 0 18px;max-width:560px}.auth-copy{font-size:16px;line-height:1.65;color:#d6e7f1;max-width:525px;margin:0}.auth-feature{display:flex;gap:11px;align-items:center;margin-top:29px;color:#d5e7f3;font-size:13px}.auth-tick{width:20px;height:20px;border-radius:50%;background:rgba(249,213,132,.2);color:#f8d984;display:grid;place-items:center;font-weight:700}.auth-card{background:#fff;color:#1b2d42;border-radius:15px;padding:31px;box-shadow:0 28px 55px rgba(0,19,35,.34)}.auth-card h2{font-size:21px;letter-spacing:-.03em;margin:0 0 7px}.auth-card p{font-size:13px;line-height:1.55;color:#627287;margin:0 0 18px}.auth-card label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#45566d;margin:12px 0}.auth-card input{height:40px;border:1px solid #cad7e4;border-radius:8px;padding:0 10px;font:inherit;font-size:14px}.auth-card button{width:100%;height:44px;border:0;border-radius:8px;background:#195b95;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.auth-card a{font-size:12px;color:#195b95;font-weight:700;text-decoration:none}.auth-status{display:none;margin:14px 0 0;padding:10px 12px;border-radius:7px;background:#fdebed;color:#962b35;font-size:12px}.auth-secure{text-align:center;color:#718095;font-size:11px;margin:17px 0 0}.auth-flow{max-width:1000px;margin:0 auto;padding:0 42px 39px;position:relative;display:flex;gap:9px;align-items:center;color:#c1d9e7;font-size:11px}.auth-flow strong{color:#fff}.auth-arrow{color:#f7d786;font-size:15px}@media(max-width:720px){.auth-nav{padding:0 23px}.auth-support{display:none}.auth-content{padding:57px 24px 41px;grid-template-columns:1fr;gap:34px}.auth-title{font-size:40px}.auth-flow{padding:0 24px 28px;flex-wrap:wrap}.auth-card{max-width:410px}}
</style><style>

  #mobile-nav b{display:block;font-size:16px;line-height:18px}

<body><div class="app"><header><div class="brand">Parish Attendance</div><div id="account-controls" style="display:flex;align-items:center;gap:12px"><div class="muted">Role: <span id="role-label">Attendance Counter</span></div><button id="mobile-menu" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button><button id="logout" style="border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer">Log out</button></div></header><div class="parish-context"><div class="sub" id="parish-name">Select a parish</div><label id="working-diocese-control" style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;font-size:11px;font-weight:700;color:#59677b">Diocese:<select id="working-diocese" style="min-width:210px;height:34px;border:1px solid #cbd6e4;border-radius:6px;padding:0 8px;font:inherit;background:#fff"></select></label><label id="working-parish-control" style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;margin-left:auto;font-size:11px;font-weight:700;color:#59677b">Parish:<select id="working-parish" style="min-width:210px;height:34px;border:1px solid #cbd6e4;border-radius:6px;padding:0 8px;font:inherit;background:#fff"></select></label></div><div class="shell"><nav style="display:none"><button class="active" data-view="entry">Attendance entry</button><button data-view="report">Mass averages</button></nav><main id="main"></main></div></div><div id="mobile-nav" aria-label="Mobile navigation"><button type="button" class="active" data-mobile-view="entry"><b>⌕</b>Attendance</button><button type="button" data-mobile-view="report"><b>◫</b>Reports</button><button type="button" data-mobile-menu><b>☰</b>More</button></div><script>
const main=document.querySelector('#main'),name=document.querySelector('#parish-name');let orgs=[],dioceses=[],view='entry',canExportReports=false;const day=new Date().toISOString().slice(0,10);const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const mobileMenu=document.querySelector('#mobile-menu');
const closeMobileMenu=()=>{document.body.classList.remove('mobile-menu-open');mobileMenu?.setAttribute('aria-expanded','false')};
mobileMenu?.addEventListener('click',()=>{const open=document.body.classList.toggle('mobile-menu-open');mobileMenu.setAttribute('aria-expanded',String(open))});
document.querySelector('[data-mobile-menu]')?.addEventListener('click',()=>mobileMenu?.click());
document.querySelectorAll('[data-mobile-view]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.mobileView==='report'){view='report';document.querySelectorAll('nav button').forEach(item=>item.classList.remove('active'));reportView('weekend')}else document.querySelector(`[data-view="${button.dataset.mobileView}"]`)?.click();document.querySelectorAll('[data-mobile-view]').forEach(item=>item.classList.toggle('active',item===button));closeMobileMenu()}));
let accessToken=sessionStorage.getItem('access_token')||'',cognitoConfig;
const b64=v=>btoa(String.fromCharCode(...new Uint8Array(v))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
async function ensureAuthenticated(){if(accessToken)return;await new Promise(resolve=>showSignIn(resolve))}
async function authPost(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await r.json().catch(()=>({error:'We could not complete that request.'}));if(!r.ok)throw new Error(data.error||'We could not complete that request.');return data}
function showSignIn(done){document.body.classList.add('signed-out');let email='',session='';const portal=document.createElement('section');portal.id='auth-portal';document.body.append(portal);const complete=token=>{accessToken=token;sessionStorage.setItem('access_token',token);portal.remove();document.body.classList.remove('signed-out');done()};const form=(mode='sign-in')=>{const resetting=mode==='reset',confirming=mode==='confirm',newPassword=mode==='new-password';portal.innerHTML=`<header class="auth-nav"><div class="auth-wordmark"><span class="auth-symbol">✦</span><span>Parish Attendance</span></div><span class="auth-support">Secure attendance management for parish teams</span></header><main class="auth-content"><div><div class="auth-eyebrow">WELCOME TO YOUR PARISH WORKSPACE</div><h1 class="auth-title">Every Mass, counted with care.</h1><p class="auth-copy">Record attendance, keep schedules current, and understand the patterns that help your parish plan with confidence.</p><div class="auth-feature"><span class="auth-tick">✓</span><span>Your parish data stays protected with secure sign-in.</span></div></div><form class="auth-card" id="auth-form"><div class="auth-symbol" style="background:#195b95;border:0;color:#fff;margin-bottom:17px">✦</div><h2>${newPassword?'Set a new password':confirming?'Check your email':resetting?'Reset your password':'Welcome back'}</h2><p>${newPassword?'Your account needs a permanent password before you continue.':confirming?'Enter the confirmation code Cognito emailed you, then choose a new password.':resetting?'We’ll email a confirmation code to reset your password.':'Sign in with the email address your parish administrator used to invite you.'}</p><label>Email address<input id="auth-email" type="email" value="${esc(email)}" placeholder="you@parish.org" ${newPassword?'readonly':''}></label>${confirming?'<label>Confirmation code<input id="auth-code" inputmode="numeric" autocomplete="one-time-code"></label>':''}${newPassword||confirming?`<label>New password<input id="auth-password" type="password" autocomplete="new-password" placeholder="••••••••"></label><label>Confirm new password<input id="auth-password-confirm" type="password" autocomplete="new-password" placeholder="••••••••"></label><div id="auth-password-help" style="font-size:12px;line-height:1.55;color:#627287;margin-top:12px">Use at least 12 characters, including an uppercase letter, lowercase letter, number, and symbol.</div><div id="auth-password-match" style="font-size:12px;margin-top:7px"></div>`:`<label>Password<input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••"></label>`}<button type="submit">${newPassword?'Save password and sign in':confirming?'Reset password':resetting?'Email confirmation code':'Sign in'}</button><div class="auth-status" id="auth-status"></div><div class="auth-links">${resetting||confirming?'<a href="#" id="back-sign-in">Back to sign in</a>':'<a href="#" id="forgot-password">Forgot password?</a><a href="#" id="need-invite">Need an invitation?</a>'}</div><div class="auth-secure">⌁ &nbsp;Securely authenticated by Parish Attendance</div></form></main>`;const showError=t=>{const n=portal.querySelector('#auth-status');n.textContent=t;n.style.display='block'};const confirmPassword=portal.querySelector('#auth-password-confirm'),passwordInput=portal.querySelector('#auth-password'),passwordMeetsRequirements=password=>password.length>=12&&/[a-z]/.test(password)&&/[A-Z]/.test(password)&&/[0-9]/.test(password)&&/[^A-Za-z0-9]/.test(password);if(confirmPassword){const updatePasswordMatch=()=>{const password=passwordInput.value,confirmation=confirmPassword.value,match=portal.querySelector('#auth-password-match'),help=portal.querySelector('#auth-password-help');if(password){help.textContent=passwordMeetsRequirements(password)?'✓ Password requirements met.':'Use at least 12 characters, including an uppercase letter, lowercase letter, number, and symbol.';help.style.color=passwordMeetsRequirements(password)?'#176344':'#627287'}if(!confirmation){match.textContent='';return}if(password===confirmation){match.textContent='✓ Passwords match';match.style.color='#176344'}else{match.textContent='Passwords do not match.';match.style.color='#a22b34'}};passwordInput.addEventListener('input',updatePasswordMatch);confirmPassword.addEventListener('input',updatePasswordMatch)}portal.querySelector('#auth-form').onsubmit=async event=>{event.preventDefault();email=portal.querySelector('#auth-email').value.trim();const password=passwordInput.value,confirmation=confirmPassword?.value;if((newPassword||confirming)&&!passwordMeetsRequirements(password))return showError('Choose a password that meets the listed requirements.');if((newPassword||confirming)&&password!==confirmation)return showError('New password and confirmation must match.');try{if(newPassword){const x=await authPost('/auth/new-password',{email,password,session});complete(x.accessToken)}else if(confirming){await authPost('/auth/password-reset/confirm',{email,code:portal.querySelector('#auth-code').value.trim(),password});form('sign-in')}else if(resetting){await authPost('/auth/password-reset',{email});form('confirm')}else{const x=await authPost('/auth/sign-in',{email,password});x.challenge==='new_password'?(session=x.session,form('new-password')):complete(x.accessToken)}}catch(error){showError(error.message)}};portal.querySelector('#forgot-password')?.addEventListener('click',event=>{event.preventDefault();form('reset')});portal.querySelector('#back-sign-in')?.addEventListener('click',event=>{event.preventDefault();form('sign-in')});portal.querySelector('#need-invite')?.addEventListener('click',event=>{event.preventDefault();showError('Contact your parish administrator to request an invitation.')})};form()}
function returnToSignIn(){accessToken='';sessionStorage.removeItem('access_token');sessionStorage.removeItem('pkce_verifier');location.replace('/app/')}
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json','Authorization':`Bearer ${accessToken}`,...(opts.headers||{})},...opts});if(r.status===401){returnToSignIn();throw new Error('Your session has ended. Please sign in again.')}if(!r.ok)throw new Error((await r.json().catch(()=>({error:r.statusText}))).error||r.statusText);return r.status===204?null:r.json()}
function selectHTML(){return `<input id="org" type="hidden">`}
function renderWorkingParishSelector(){const parishControl=document.querySelector('#working-parish-control'),parishSelect=document.querySelector('#working-parish'),dioceseControl=document.querySelector('#working-diocese-control'),dioceseSelect=document.querySelector('#working-diocese');if(!parishControl||!parishSelect||!dioceseControl||!dioceseSelect)return;const selected=activeParishID(),activeParish=orgs.find(parish=>parish.id===selected),multiple=orgs.length>1&&!parishSelectionRequired;document.body.classList.toggle('multiple-parishes',multiple);name.style.display=multiple?'none':'';if(!multiple){parishControl.style.display='none';dioceseControl.style.display='none';return}const availableDioceses=[];orgs.forEach(parish=>{const id=parish.dioceseId||'';if(!availableDioceses.some(diocese=>diocese.id===id))availableDioceses.push({id,name:dioceses.find(diocese=>diocese.id===id)?.name||'Unassigned Diocese'})});const activeDioceseID=activeParish?.dioceseId||'';dioceseSelect.innerHTML=availableDioceses.map(diocese=>`<option value="${esc(diocese.id)}">${esc(diocese.name)}</option>`).join('');dioceseSelect.value=activeDioceseID;const parishOptions=orgs.filter(parish=>(parish.dioceseId||'')===dioceseSelect.value);parishSelect.innerHTML=parishOptions.map(parish=>`<option value="${parish.id}">${esc(parish.name)}</option>`).join('');parishSelect.value=selected;dioceseSelect.onchange=()=>{const parish=orgs.find(item=>(item.dioceseId||'')===dioceseSelect.value);if(parish)setActiveParish(parish.id,true)};parishSelect.onchange=()=>setActiveParish(parishSelect.value,true);dioceseControl.style.display='flex';parishControl.style.display='flex'}
async function entry(){main.innerHTML=`<h1>Record attendance</h1><p class="muted">Choose a date to pre-fill the scheduled masses.</p><div class="tools">${selectHTML()}<label>Service date<input id="date" type="date" value="${day}"></label><button class="primary" id="load">Load masses</button></div><div id="notice" class="notice"></div><div id="services" class="empty">Choose a parish, then load its scheduled masses.</div>`;wireOrg();document.querySelector('#load').onclick=loadMasses}
let parishSelectionResolved=false,parishSelectionRequired=false;
function activeParishID(){if(!parishSelectionResolved)return '';return orgs.some(x=>x.id===localStorage.parish)?localStorage.parish:orgs[0]?.id||''}
function setActiveParish(id,refreshRole=false){const parish=orgs.find(parish=>parish.id===id);if(!parish)return;localStorage.parish=id;const diocese=dioceses.find(item=>item.id===parish.dioceseId);name.textContent=diocese?`${diocese.name} · ${parish.name}`:parish.name;renderWorkingParishSelector();if(refreshRole)void refreshActiveParishIdentity(true)}
document.addEventListener('change',event=>{const select=event.target;if(select instanceof HTMLSelectElement&&select.matches('[data-active-parish]'))setActiveParish(select.value,true)})
function wireOrg(){const e=document.querySelector('#org'),selected=activeParishID();if(!e)return;e.value=selected;if(selected)setActiveParish(selected)}

  main.innerHTML=`<div style="max-width:560px;margin:38px auto"><div style="font-size:11px;letter-spacing:.12em;font-weight:700;color:#806119">YOUR PARISH WORKSPACE</div><h1 style="margin-bottom:8px">Which Parish are you working with?</h1><p class="muted">Choose a Parish to load the role, navigation, and workspace assigned to you.</p><div style="display:grid;gap:10px;margin-top:24px">${orgs.map(parish=>{const role=(identity.roles||[]).find(item=>item.parishId===parish.id),diocese=dioceses.find(item=>item.id===parish.dioceseId);return `<button data-choose-parish="${parish.id}" style="display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px 18px;border:1px solid #cbd6e4;border-radius:8px;background:#fff;font:inherit;cursor:pointer"><span><strong style="display:block;font-size:15px">${esc(parish.name)}</strong><span class="muted">${esc(diocese?.name||'Unassigned Diocese')} · ${esc(role?.roleName||'Assigned user')}</span></span><span style="font-size:22px;color:#155a9d">›</span></button>`}).join('')}</div></div>`;
  main.querySelectorAll('[data-choose-parish]').forEach(button=>button.onclick=()=>{parishSelectionRequired=false;parishSelectionResolved=true;renderWorkingParishSelector();setActiveParish(button.dataset.chooseParish);shell.classList.remove('parish-choice');void refreshActiveParishIdentity(true)});

async function loadMasses(){const org=document.querySelector('#org').value,date=document.querySelector('#date').value;if(!org)return message('Choose a parish.',true);try{const [masses,records]=await Promise.all([api(`/parishes/${org}/scheduled-masses?date=${date}`),api(`/parishes/${org}/attendance?from=${date}&to=${date}`)]);const existing=new Map(records.map(x=>[x.serviceTime,x]));document.querySelector('#services').innerHTML=masses.length?masses.map(m=>{const a=existing.get(m.serviceTime);return `<div class="service" data-t="${m.serviceTime}" data-name="${esc(m.name)}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${m.serviceTime}</div><div class="muted">${esc(m.name)}</div></div><input type="number" min="0" value="${a?.attendanceCount??''}" placeholder="Count"><span class="saved">${a?'Saved':''}</span></div>`}).join('')+`<div class="tools"><button class="primary" id="save">Save attendance</button></div>`:'<div class="empty">No scheduled masses for this date.</div>';const save=document.querySelector('#save');if(save)save.onclick=saveAttendance}catch(e){message(e.message,true)}}
async function saveAttendance(){const org=document.querySelector('#org').value,date=document.querySelector('#date').value,rows=[...document.querySelectorAll('.service')];try{await Promise.all(rows.filter(x=>x.querySelector('input').value!=='').map(x=>api(`/parishes/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:date,serviceTime:x.dataset.t,massName:x.dataset.name,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadMasses()}catch(e){message(e.message,true)}}
async function report(){main.innerHTML=`<h1>Mass attendance averages</h1><p class="muted">Averages include recorded recurring services only.</p><div class="tools">${selectHTML()}<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="run">Run report</button></div><div id="notice" class="notice"></div><div id="results" class="empty">Choose a parish and run the report.</div>`;wireOrg();document.querySelector('#run').onclick=async()=>{const org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);try{const x=await api(`/parishes/${org}/reports/mass-attendance?from=${document.querySelector('#from').value}&to=${document.querySelector('#to').value}`);document.querySelector('#results').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Services</th><th>Average</th><th>Range</th></tr></thead><tbody>${x.map(r=>`<tr><td>${esc(r.massName)}</td><td>${r.servicesCounted}</td><td class="average">${r.averageAttendance}</td><td>${r.lowestAttendance} – ${r.highestAttendance}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No attendance records in this period.</div>'}catch(e){message(e.message,true)}}}
function message(t,bad=false){const n=document.querySelector('#notice');n.textContent=t;n.className='notice '+(bad?'error':'');n.style.display='block'}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;view==='entry'?entry():report()});(async()=>{try{await ensureAuthenticated();[orgs,dioceses]=await Promise.all([api('/parishes'),api('/dioceses')]);const identity=await api('/me');const isSystem=(identity.roles||[]).some(role=>role.role==='system_administrator');if(!isSystem&&orgs.length>1){chooseActiveParish(identity);return}parishSelectionResolved=true;renderWorkingParishSelector();await refreshActiveParishIdentity(true)}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}})();
const adminButton=document.createElement('button');adminButton.textContent='Administration';document.querySelector('nav').append(adminButton);adminButton.onclick=async()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));adminButton.classList.add('active');main.innerHTML=`<h1>Administration</h1><p class="muted">Create parishes and add recurring mass times.</p><div id="notice" class="notice"></div><div class="tools"><label>Parish name<input id="new-org" placeholder="St. Mary Parish"></label><button class="primary" id="create-org">Create parish</button></div><div class="tools">${selectHTML()}<label>Mass name<input id="mass-name" placeholder="Sunday 9:00 AM"></label><label>Day<select id="weekday"><option value="0">Sunday</option><option value="6">Saturday</option></select></label><label>Time<input id="mass-time" type="time" value="09:00"></label><button class="primary" id="add-mass">Add weekly mass</button></div><div id="templates" class="empty">Choose a parish to view its schedule.</div>`;wireOrg();const load=async()=>{const o=document.querySelector('#org').value;if(!o)return;const x=await api(`/parishes/${o}/mass-templates`);document.querySelector('#templates').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Day</th><th>Time</th></tr></thead><tbody>${x.map(m=>`<tr><td>${esc(m.name)}</td><td>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][m.weekday]}</td><td>${m.serviceTime}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No weekly masses have been added.</div>'};document.querySelector('#org').onchange=load;document.querySelector('#create-org').onclick=async()=>{const n=document.querySelector('#new-org').value.trim();if(!n)return message('Enter a parish name.',true);const x=await api('/parishes',{method:'POST',body:JSON.stringify({name:n,timezone:'America/Chicago'})});orgs.push(x);localStorage.parish=x.id;message('Parish created.');load()};document.querySelector('#add-mass').onclick=async()=>{const o=document.querySelector('#org').value,n=document.querySelector('#mass-name').value.trim(),t=document.querySelector('#mass-time').value;if(!o||!n||!t)return message('Choose a parish, mass name, and time.',true);await api(`/parishes/${o}/mass-templates`,{method:'POST',body:JSON.stringify({name:n,weekday:+document.querySelector('#weekday').value,serviceTime:t,isActive:true})});message('Weekly mass added.');load()};load()};
</script>

<script>
adminButton.remove();const adminMenu=document.createElement('div');adminMenu.innerHTML='<div style="font-size:11px;font-weight:750;letter-spacing:.05em;color:#718098;margin:18px 12px 5px">ADMINISTRATION</div><button data-admin="parishes">Parishes</button><button data-admin="schedules">Mass schedules</button><button data-admin="users">User access</button>';document.querySelector('nav').append(adminMenu);const adminButtons=[...adminMenu.querySelectorAll('button')];

async function adminView(which){adminMenuState(which);if(which==='parishes'){main.innerHTML=`<h1>Parishes</h1><p class="muted">System administrators create and manage parishes.</p><div id="notice" class="notice"></div><div class="tools"><label>Parish name<input id="new-org" placeholder="St. Mary Parish"></label><button class="primary" id="create-org">Create parish</button></div><div id="org-list" class="empty"></div>`;document.querySelector('#create-org').onclick=async()=>{const n=document.querySelector('#new-org').value.trim();if(!n)return message('Enter a parish name.',true);try{const x=await api('/parishes',{method:'POST',body:JSON.stringify({name:n,timezone:'America/Chicago'})});orgs.push(x);localStorage.parish=x.id;message('Parish created.');renderParishes()}catch(e){message(e.message,true)}};renderParishes();return}if(which==='schedules'){main.innerHTML=`<h1>Mass schedules</h1><p class="muted">Parish administrators maintain recurring mass times for their parish.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>Mass name<input id="mass-name" placeholder="Sunday 9:00 AM"></label><label>Day<select id="weekday">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label>Time<input id="mass-time" type="time" value="09:00"></label><button class="primary" id="add-mass">Add weekly mass</button></div><div id="templates" class="empty">Choose a parish to view its schedule.</div>`;wireOrg();document.querySelector('#org').onchange=renderSchedules;document.querySelector('#add-mass').onclick=addSchedule;renderSchedules();return}main.innerHTML=`<h1>User access</h1><p class="muted">Parish administrators will manage attendance counters and other parish administrators for their parish.</p><div class="notice" style="display:block">User access is displayed for the demo. Role-based sign-in and user invitations will be connected when authentication is added.</div><table><thead><tr><th>User</th><th>Role</th><th>Parish</th></tr></thead><tbody><tr><td>maria@example.org</td><td>Parish Administrator</td><td>St. Mary Parish</td></tr><tr><td>james@example.org</td><td>Attendance Counter</td><td>St. Mary Parish</td></tr></tbody></table>`}
function renderParishes(){document.querySelector('#org-list').innerHTML=orgs.length?`<table><thead><tr><th>Parish</th><th>Timezone</th></tr></thead><tbody>${orgs.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.timezone)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No parishes created.</div>'}
async function renderSchedules(){const o=document.querySelector('#org')?.value;if(!o){document.querySelector('#templates').textContent='Choose a parish to view its schedule.';return}try{const x=await api(`/parishes/${o}/mass-templates`);document.querySelector('#templates').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Day</th><th>Time</th></tr></thead><tbody>${x.map(m=>`<tr><td>${esc(m.name)}</td><td>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][m.weekday]}</td><td>${m.serviceTime}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No weekly masses have been added.</div>'}catch(e){message(e.message,true)}}
async function addSchedule(){const o=document.querySelector('#org').value,n=document.querySelector('#mass-name').value.trim(),t=document.querySelector('#mass-time').value;if(!o||!n||!t)return message('Choose a parish, mass name, and time.',true);try{await api(`/parishes/${o}/mass-templates`,{method:'POST',body:JSON.stringify({name:n,weekday:+document.querySelector('#weekday').value,serviceTime:t,isActive:true})});message('Weekly mass added.');renderSchedules()}catch(e){message(e.message,true)}}adminButtons.forEach(b=>b.onclick=()=>adminView(b.dataset.admin));

<script>
function iso(d){return d.toISOString().slice(0,10)}function weekStart(v){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()-d.getDay());return iso(d)}function attendanceWeekStart(v){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+(6-d.getDay()+7)%7);return iso(d)}function plus(v,n){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
entry=async function(){const start=localStorage.weekStart||weekStart(day);main.innerHTML=`<h1>Weekly attendance ledger</h1><p class="muted">Review or enter attendance for any week—past or present.</p><div class="tools">${selectHTML()}<button class="primary" id="prev">← Previous week</button><label>Week of<input id="week" type="date" value="${start}"></label><button class="primary" id="next">Next week →</button><button class="primary" id="load">Load week</button></div><div id="notice" class="notice"></div><div id="services" class="empty">Choose a parish, then load a week.</div>`;wireOrg();document.querySelector('#prev').onclick=()=>setWeek(plus(document.querySelector('#week').value,-7));document.querySelector('#next').onclick=()=>setWeek(plus(document.querySelector('#week').value,7));document.querySelector('#load').onclick=loadWeek}
function setWeek(v){document.querySelector('#week').value=v;localStorage.weekStart=v;loadWeek()}
async function loadWeek(){const org=document.querySelector('#org').value,start=weekStart(document.querySelector('#week').value),end=plus(start,6);if(!org)return message('Choose a parish.',true);localStorage.weekStart=start;try{const x=await api(`/parishes/${org}/attendance-ledger?from=${start}&to=${end}`);document.querySelector('#services').innerHTML=x.length?x.map(m=>`<div class="service ledger" data-date="${m.serviceDate}" data-t="${m.serviceTime}" data-name="${esc(m.massName)}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${new Date(m.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${m.serviceTime}</div><div class="muted">${esc(m.massName)}</div></div><input type="number" min="0" value="${m.attendanceCount??''}" placeholder="Count"><span class="saved">${m.attendanceCount!==undefined?'Saved':'Missing'}</span></div>`).join('')+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled masses in this week.</div>';const b=document.querySelector('#save-week');if(b)b.onclick=saveWeek}catch(e){message(e.message,true)}}
async function saveWeek(){const org=document.querySelector('#org').value,rows=[...document.querySelectorAll('.ledger')].filter(x=>x.querySelector('input').value!=='');try{await Promise.all(rows.map(x=>api(`/parishes/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:x.dataset.date,serviceTime:x.dataset.t,massName:x.dataset.name,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadWeek()}catch(e){message(e.message,true)}}
</script>

<script>
const detailsButton=document.createElement('button');detailsButton.textContent='Parish details';detailsButton.dataset.admin='details';adminMenu.insertBefore(detailsButton,adminMenu.querySelector('[data-admin="schedules"]'));const baseAdminView=adminView;adminView=async function(which){if(which!=='details')return baseAdminView(which);adminMenuState(which);main.innerHTML=`<h1>Parish details</h1><p class="muted">Update parish contact information, address, and local time zone.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<button class="primary" id="load-details">Load details</button></div><div id="details" class="empty">Choose a parish to edit its details.</div>`;wireOrg();document.querySelector('#load-details').onclick=loadDetails};
async function loadDetails(){const id=document.querySelector('#org').value;if(!id)return message('Choose a parish.',true);try{const o=await api(`/parishes/${id}`);document.querySelector('#details').innerHTML=`<div class="tools"><label>Parish name<input id="d-name" value="${esc(o.name)}"></label><label>Time zone<select id="d-timezone">${['America/Chicago','America/New_York','America/Denver','America/Los_Angeles','America/Phoenix'].map(z=>`<option ${o.timezone===z?'selected':''} value="${z}">${z}</option>`).join('')}</select></label></div><div class="tools"><label>Address<input id="d-address" value="${esc(o.address||'')}" placeholder="Street, city, state, postal code"></label><label>Contact name<input id="d-contact-name" value="${esc(o.contactName||'')}"></label></div><div class="tools"><label>Contact email<input id="d-contact-email" type="email" value="${esc(o.contactEmail||'')}"></label><label>Contact phone<input id="d-contact-phone" type="tel" value="${esc(o.contactPhone||'')}"></label><button class="primary" id="save-details">Save parish</button></div>`;document.querySelector('#save-details').onclick=async()=>{const updated={name:document.querySelector('#d-name').value.trim(),address:document.querySelector('#d-address').value.trim(),contactName:document.querySelector('#d-contact-name').value.trim(),contactEmail:document.querySelector('#d-contact-email').value.trim(),contactPhone:document.querySelector('#d-contact-phone').value.trim(),timezone:document.querySelector('#d-timezone').value};if(!updated.name)return message('Parish name is required.',true);try{const saved=await api(`/parishes/${id}`,{method:'PATCH',body:JSON.stringify(updated)});orgs=orgs.map(x=>x.id===id?saved:x);name.textContent=saved.name;message('Parish details saved.')}catch(e){message(e.message,true)}}}catch(e){message(e.message,true)}}
detailsButton.onclick=()=>adminView('details');
</script>

<script>
const parishAdminView=adminView;adminView=async function(which){await parishAdminView(which);if(which==='schedules')specialMassSection()};
async function specialMassSection(){const host=document.createElement('section');host.innerHTML=`<h2 style="margin-top:34px;font-size:18px">Special masses</h2><p class="muted">Add one-time services or cancel a recurring mass for a specific date.</p><div class="tools"><label>Action<select id="special-action"><option value="ADD">Add one-time mass</option><option value="CANCEL">Cancel recurring mass</option></select></label><label>Date<input id="special-date" type="date" value="${day}"></label><label>Time<input id="special-time" type="time" value="16:00"></label><label>Name<input id="special-name" placeholder="Christmas Eve Mass"></label><label id="template-field" style="display:none">Recurring mass<select id="special-template"></select></label><button class="primary" id="save-special">Save special mass</button></div><div id="special-list" class="empty">Choose a parish to view special masses.</div>`;main.append(host);const org=document.querySelector('#org');const action=document.querySelector('#special-action');async function templates(){const id=org.value;if(!id)return [];return api(`/parishes/${id}/mass-templates`)}async function refresh(){const id=org.value;if(!id)return;try{const x=await api(`/parishes/${id}/special-masses`);document.querySelector('#special-list').innerHTML=x.length?`<table><thead><tr><th>Action</th><th>Date</th><th>Time</th><th>Mass</th></tr></thead><tbody>${x.map(s=>`<tr><td>${s.action==='ADD'?'Added':'Canceled'}</td><td>${s.serviceDate}</td><td>${s.serviceTime}</td><td>${esc(s.name)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No special mass changes.</div>'}catch(e){message(e.message,true)}}async function updateAction(){const cancel=action.value==='CANCEL';document.querySelector('#template-field').style.display=cancel?'grid':'none';if(cancel){const x=await templates();document.querySelector('#special-template').innerHTML=x.map(m=>`<option value="${m.id}" data-time="${m.serviceTime}" data-name="${esc(m.name)}">${esc(m.name)} · ${m.serviceTime}</option>`).join('');const first=document.querySelector('#special-template option');if(first){document.querySelector('#special-time').value=first.dataset.time;document.querySelector('#special-name').value=first.dataset.name}}}action.onchange=updateAction;org.addEventListener('change',refresh);document.querySelector('#save-special').onclick=async()=>{const id=org.value;if(!id)return message('Choose a parish.',true);const cancel=action.value==='CANCEL',payload={action:action.value,serviceDate:document.querySelector('#special-date').value,serviceTime:document.querySelector('#special-time').value,name:document.querySelector('#special-name').value.trim()};if(cancel)payload.massTemplateId=document.querySelector('#special-template').value;if(!payload.serviceDate||!payload.serviceTime||!payload.name)return message('Date, time, and name are required.',true);try{await api(`/parishes/${id}/special-masses`,{method:'POST',body:JSON.stringify(payload)});message('Special mass saved.');refresh()}catch(e){message(e.message,true)}};updateAction();refresh()}
</script>

<script>

async function parishList(){adminMenuState('parishes');main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Parishes</h1><p class="muted">Parishes that use Parish Attendance.</p></div><button class="primary" id="add-parish">+ Add parish</button></div><div id="parish-list" class="empty">Loading parishes…</div>`;document.querySelector('#add-parish').onclick=()=>parishDetails();try{orgs=await api('/parishes');document.querySelector('#parish-list').innerHTML=orgs.length?`<table><thead><tr><th>Parish</th><th>Address</th><th>Time zone</th><th></th></tr></thead><tbody>${orgs.map(o=>`<tr><td><strong>${esc(o.name)}</strong></td><td>${esc(o.address||'—')}</td><td>${esc(o.timezone)}</td><td><button class="primary" data-org="${o.id}" style="height:31px;padding:0 10px">View details</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No parishes created yet.</div>';document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>parishDetails(b.dataset.org))}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

<script>
const formatScheduleTime=t=>(t||'').slice(0,5);
function schedulePage(section='recurring'){
  adminMenuState('schedules');
  main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Mass schedules</h1><p class="muted">Manage recurring and one-time Masses for your parish.</p></div></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}</div><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="recurring-tab" style="padding:10px 0;color:${section==='recurring'?'#155a9d':'#27364d'};text-decoration:none;${section==='recurring'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Recurring templates</a><a href="#" id="special-tab" style="padding:10px 0;color:${section==='special'?'#155a9d':'#27364d'};text-decoration:none;${section==='special'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Special Masses</a></div><div id="schedule-content"></div>`;

  document.querySelector('#special-tab').onclick=e=>{e.preventDefault();schedulePage('special')};

}
function scheduleList(items,render){return items.length?`<div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${items.map(render).join('')}</div>`:''}
function scheduleRow(content,actions){return `<div style="display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:17px 18px;border-bottom:1px solid #e7edf4"><div>${content}</div><div>${actions}</div></div>`}

  try { const templates=await api(`/parishes/${org}/mass-templates`);const list=document.querySelector('#templates');list.innerHTML=scheduleList(templates,t=>scheduleRow(`<strong style="font-size:16px">${esc(massName(t.weekday,formatScheduleTime(t.serviceTime)))}</strong><div class="muted">Active weekly</div>`,`<a href="#" data-edit-template="${t.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete-template="${t.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a>`))||'<div class="empty">No recurring Masses have been added.</div>';document.querySelectorAll('[data-edit-template]').forEach(b=>b.onclick=e=>{e.preventDefault();recurringEditor(templates.find(t=>t.id===b.dataset.editTemplate))});document.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this recurring Mass? Existing attendance history will remain.'))return;try{await api(`/mass-templates/${b.dataset.deleteTemplate}`,{method:'DELETE'});message('Recurring Mass deleted.');renderRecurringSchedule()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}
}
function recurringEditor(template){

  host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${template?'Edit recurring Mass':'Add recurring Mass'}</strong><div class="tools"><label>Day<select id="edit-weekday">${weekdays.map((d,i)=>`<option value="${i}" ${template?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Time<input id="edit-time" type="time" value="${formatScheduleTime(template?.serviceTime)||'09:00'}"></label><span class="muted" id="inferred-name" style="padding-bottom:9px"></span><button class="primary" id="save-template">${template?'Save changes':'Add Mass'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;

async function renderSpecialMasses(){

function specialMassEditor(special){

async function recurringCancellationEditor(){

<script>

}

  return `<label>Mass name<select id="${id}"><option value="" ${selectedID?'':'selected'}>-- Select Mass Name --</option>${names.map(n=>`<option value="${n.id}" data-name="${esc(n.name)}" ${n.id===selectedID?'selected':''}>${esc(n.name)}${n.isActive?'':' (retired)'}</option>`).join('')}</select></label>`;
}
function schedulePage(section='recurring'){
  adminMenuState('schedules');
  main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Mass schedules</h1><p class="muted">Manage recurring and one-time Masses for your parish.</p></div><button id="manage-mass-names" style="height:37px;border:1px solid #b9cee4;background:#fff;color:#155a9d;border-radius:6px;padding:0 14px;font:inherit;font-weight:700">Manage Mass names</button></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}</div><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="recurring-tab" style="padding:10px 0;color:${section==='recurring'?'#155a9d':'#27364d'};text-decoration:none;${section==='recurring'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Recurring templates</a><a href="#" id="special-tab" style="padding:10px 0;color:${section==='special'?'#155a9d':'#27364d'};text-decoration:none;${section==='special'?'border-bottom:3px solid #176bb0;font-weight:700':''}">Special Masses</a></div><div id="schedule-content"></div>`;
  wireOrg();document.querySelector('#org').onchange=()=>schedulePage(section);document.querySelector('#manage-mass-names').onclick=massNamesPage;document.querySelector('#recurring-tab').onclick=e=>{e.preventDefault();schedulePage('recurring')};document.querySelector('#special-tab').onclick=e=>{e.preventDefault();schedulePage('special')};section==='recurring'?renderRecurringSchedule():renderSpecialMasses();
}
async function recurringEditor(template){
  const host=document.querySelector('#template-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);
  try { const names=await loadMassNameOptions(org,template?.massNameId);if(!names.length){host.innerHTML='<div class="empty">Create a Mass name before adding a recurring Mass.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${template?'Edit recurring Mass':'Add recurring Mass'}</strong><div class="tools">${massNameSelect(names,template?.massNameId)}<label>Day<select id="edit-weekday">${weekdays.map((d,i)=>`<option value="${i}" ${template?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Time<input id="edit-time" type="time" value="${formatScheduleTime(template?.serviceTime)||'09:00'}"></label><button class="primary" id="save-template">${template?'Save changes':'Add Mass'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;document.querySelector('#cancel-template').onclick=()=>host.innerHTML='';document.querySelector('#save-template').onclick=async()=>{const option=document.querySelector('#mass-name-id').selectedOptions[0],time=document.querySelector('#edit-time').value,weekday=+document.querySelector('#edit-weekday').value,payload={massNameId:option.value,name:option.dataset.name,weekday,serviceTime:time,isActive:template?.isActive??true,activeFrom:template?.activeFrom,activeTo:template?.activeTo};try{await api(template?`/mass-templates/${template.id}`:`/parishes/${org}/mass-templates`,{method:template?'PATCH':'POST',body:JSON.stringify(payload)});message(template?'Recurring Mass updated.':'Recurring Mass added.');renderRecurringSchedule()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function specialMassEditor(special){
  const host=document.querySelector('#special-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);
  try { const names=await loadMassNameOptions(org,special?.massNameId);if(!names.length){host.innerHTML='<div class="empty">Create a Mass name before adding a special Mass.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${special?'Edit special Mass':'Add special Mass'}</strong><div class="tools">${massNameSelect(names,special?.massNameId)}<label>Mass date<input id="special-date" type="date" value="${special?.serviceDate||day}"></label><label>Mass time<input id="special-time" type="time" value="${formatScheduleTime(special?.serviceTime)||'16:00'}"></label><button class="primary" id="save-special">${special?'Save changes':'Add special Mass'}</button><button id="cancel-special" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;document.querySelector('#cancel-special').onclick=()=>host.innerHTML='';document.querySelector('#save-special').onclick=async()=>{const option=document.querySelector('#mass-name-id').selectedOptions[0],payload={action:'ADD',massNameId:option.value,name:option.dataset.name,serviceDate:document.querySelector('#special-date').value,serviceTime:document.querySelector('#special-time').value};try{await api(special?`/special-masses/${special.id}`:`/parishes/${org}/special-masses`,{method:special?'PATCH':'POST',body:JSON.stringify(payload)});message(special?'Special Mass updated.':'Special Mass added.');renderSpecialMasses()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function recurringCancellationEditor(){
  const host=document.querySelector('#special-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);try { const templates=await api(`/parishes/${org}/mass-templates`);if(!templates.length){host.innerHTML='<div class="empty">Add a recurring Mass before creating a cancellation.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>Cancel recurring Mass</strong><p class="muted">This removes the selected recurring Mass from the attendance ledger for one date. It does not affect other weeks.</p><div class="tools"><label>Recurring Mass<select id="cancel-template">${templates.map(t=>`<option value="${t.id}" data-name="${esc(t.name)}" data-time="${formatScheduleTime(t.serviceTime)}" data-mass-name-id="${t.massNameId}">${esc(t.name)} · ${formatScheduleTime(t.serviceTime)}</option>`).join('')}</select></label><label>Date<input id="cancel-date" type="date" value="${day}"></label><button class="primary" id="save-cancellation">Cancel Mass</button><button id="cancel-cancellation" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Close</button></div></div>`;document.querySelector('#cancel-cancellation').onclick=()=>host.innerHTML='';document.querySelector('#save-cancellation').onclick=async()=>{const option=document.querySelector('#cancel-template').selectedOptions[0],payload={action:'CANCEL',massTemplateId:option.value,massNameId:option.dataset.massNameId,name:option.dataset.name,serviceDate:document.querySelector('#cancel-date').value,serviceTime:option.dataset.time};try{await api(`/parishes/${org}/special-masses`,{method:'POST',body:JSON.stringify(payload)});message('Recurring Mass canceled for the selected date.');renderSpecialMasses()}catch(error){message(error.message,true)}}}catch(error){message(error.message,true)}
}
async function massNamesPage(){
  adminMenuState('schedules');main.innerHTML=`<h1>Mass names</h1><p class="muted">Use the same Mass name for recurring and special Masses to keep reporting consistent across years.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>New Mass name<input id="new-mass-name" placeholder="Christmas Eve Vigil"></label><button class="primary" id="add-mass-name">Add Mass name</button><button id="back-to-schedules" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Back to schedules</button></div><div id="mass-name-list" class="empty">Choose a parish to manage Mass names.</div>`;wireOrg();document.querySelector('#org').onchange=renderMassNames;document.querySelector('#back-to-schedules').onclick=()=>schedulePage('recurring');document.querySelector('#add-mass-name').onclick=async()=>{const org=document.querySelector('#org').value,name=document.querySelector('#new-mass-name').value.trim();if(!org||!name)return message('Choose a parish and enter a Mass name.',true);try{await api(`/parishes/${org}/mass-names`,{method:'POST',body:JSON.stringify({name,isActive:true})});document.querySelector('#new-mass-name').value='';message('Mass name added.');renderMassNames()}catch(error){message(error.message,true)}};renderMassNames();
}
async function renderMassNames(){const org=document.querySelector('#org').value,host=document.querySelector('#mass-name-list');if(!org){host.textContent='Choose a parish to manage Mass names.';return}try{const names=await api(`/parishes/${org}/mass-names`);host.innerHTML=scheduleList(names,n=>scheduleRow(`<label style="display:block">Mass name<input data-name-input="${n.id}" value="${esc(n.name)}" style="margin-top:6px;min-width:260px"></label><div class="muted">${n.isActive?'Available for schedules':'Retired — retained for reporting'}</div>`,`<a href="#" data-save-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Save</a><a href="#" data-toggle-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none;margin-left:16px">${n.isActive?'Retire':'Restore'}</a>`))||'<div class="empty">No Mass names have been created.</div>';document.querySelectorAll('[data-save-name]').forEach(b=>b.onclick=async e=>{e.preventDefault();const n=names.find(n=>n.id===b.dataset.saveName),value=document.querySelector(`[data-name-input="${n.id}"]`).value.trim();if(!value)return message('Mass name is required.',true);try{await api(`/mass-names/${n.id}`,{method:'PATCH',body:JSON.stringify({name:value,isActive:n.isActive})});message('Mass name saved.');renderMassNames()}catch(error){message(error.message,true)}});document.querySelectorAll('[data-toggle-name]').forEach(b=>b.onclick=async e=>{e.preventDefault();const n=names.find(n=>n.id===b.dataset.toggleName);try{await api(`/mass-names/${n.id}`,{method:'PATCH',body:JSON.stringify({name:n.name,isActive:!n.isActive})});message(n.isActive?'Mass name retired.':'Mass name restored.');renderMassNames()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}}
async function report(){main.innerHTML=`<h1>Mass attendance averages</h1><p class="muted">Averages include recurring and special Masses with recorded attendance.</p><div class="tools">${selectHTML()}<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="run">Run report</button></div><div id="notice" class="notice"></div><div id="results" class="empty">Choose a parish and run the report.</div>`;wireOrg();document.querySelector('#run').onclick=async()=>{const org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);try{const x=await api(`/parishes/${org}/reports/mass-attendance?from=${document.querySelector('#from').value}&to=${document.querySelector('#to').value}`);document.querySelector('#results').innerHTML=x.length?`<table><thead><tr><th>Mass</th><th>Services</th><th>Average</th><th>Range</th></tr></thead><tbody>${x.map(r=>`<tr><td>${esc(r.massName)}</td><td>${r.servicesCounted}</td><td class="average">${r.averageAttendance}</td><td>${r.lowestAttendance} – ${r.highestAttendance}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No attendance records in this period.</div>'}catch(error){message(error.message,true)}}}
</script>

<script>
async function loadWeek(){const org=document.querySelector('#org').value,start=weekStart(document.querySelector('#week').value),end=plus(start,6);if(!org)return message('Choose a parish.',true);localStorage.weekStart=start;try{const x=await api(`/parishes/${org}/attendance-ledger?from=${start}&to=${end}`);document.querySelector('#services').innerHTML=x.length?x.map(m=>`<div class="service ledger" data-date="${m.serviceDate}" data-t="${m.serviceTime}" data-name="${esc(m.massName)}" data-mass-name="${m.massNameId||''}" data-template="${m.massTemplateId||''}" data-special="${m.specialMassId||''}"><div><div class="time">${new Date(m.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${m.serviceTime}</div><div class="muted">${esc(m.massName)}</div></div><input type="number" min="0" value="${m.attendanceCount??''}" placeholder="Count"><span class="saved">${m.attendanceCount!==undefined?'Saved':'Missing'}</span></div>`).join('')+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled masses in this week.</div>';const b=document.querySelector('#save-week');if(b)b.onclick=saveWeek}catch(error){message(error.message,true)}}
async function saveWeek(){const org=document.querySelector('#org').value,rows=[...document.querySelectorAll('.ledger')].filter(x=>x.querySelector('input').value!=='');try{await Promise.all(rows.map(x=>api(`/parishes/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:x.dataset.date,serviceTime:x.dataset.t,massName:x.dataset.name,massNameId:x.dataset.massName||undefined,massTemplateId:x.dataset.template||undefined,specialMassId:x.dataset.special||undefined,attendanceCount:+x.querySelector('input').value})})));message('Attendance saved.');loadWeek()}catch(error){message(error.message,true)}}
</script>

<script>
async function renderRecurringSchedule(){
  const host=document.querySelector('#schedule-content'),org=document.querySelector('#org').value;
  host.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;font-size:19px">Recurring templates</h2><p class="muted">Choose a Mass name, then set the weekday and time for each recurring service.</p></div><button class="primary" id="add-template">+ Add recurring Mass</button></div><div id="template-editor"></div><div id="templates" class="empty">${org?'Loading recurring Masses…':'Choose a parish to view its schedule.'}</div>`;
  document.querySelector('#add-template').onclick=()=>recurringEditor();
  if(!org)return;
  try { const templates=await api(`/parishes/${org}/mass-templates`),list=document.querySelector('#templates');list.innerHTML=scheduleList(templates,t=>scheduleRow(`<strong style="font-size:16px">${esc(t.name)}</strong><div class="muted">${weekdays[t.weekday]} · ${formatScheduleTime(t.serviceTime)} · Active weekly</div>`,`<a href="#" data-edit-template="${t.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-delete-template="${t.id}" style="color:#a22b34;font-weight:700;text-decoration:none;margin-left:16px">Delete</a>`))||'<div class="empty">No recurring Masses have been added.</div>';document.querySelectorAll('[data-edit-template]').forEach(b=>b.onclick=e=>{e.preventDefault();recurringEditor(templates.find(t=>t.id===b.dataset.editTemplate))});document.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Delete this recurring Mass? Existing attendance history will remain.'))return;try{await api(`/mass-templates/${b.dataset.deleteTemplate}`,{method:'DELETE'});message('Recurring Mass deleted.');renderRecurringSchedule()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}
}
</script>

<script>
const renderParishesWithShortAdd=parishList;
parishList=async function(){await renderParishesWithShortAdd();const add=document.querySelector('#add-parish');if(add)add.textContent='Add'};
const renderRecurringWithShortAdd=renderRecurringSchedule;
renderRecurringSchedule=async function(){await renderRecurringWithShortAdd();const add=document.querySelector('#add-template');if(add)add.textContent='Add'};
const renderSpecialWithShortAdd=renderSpecialMasses;
renderSpecialMasses=async function(){await renderSpecialWithShortAdd();const add=document.querySelector('#add-special');if(add)add.textContent='Add'};
async function massNamesPage(){
  adminMenuState('schedules');
  main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Mass names</h1><p class="muted">Use the same Mass name for recurring and special Masses to keep reporting consistent across years.</p></div><button class="primary" id="add-mass-name">Add</button></div><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<button id="back-to-schedules" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Back to schedules</button></div><div id="mass-name-editor"></div><div id="mass-name-list" class="empty">Choose a parish to manage Mass names.</div>`;
  wireOrg();document.querySelector('#org').onchange=renderMassNames;document.querySelector('#back-to-schedules').onclick=()=>schedulePage('recurring');document.querySelector('#add-mass-name').onclick=()=>massNameEditor();renderMassNames();
}
function massNameEditor(massName){
  const host=document.querySelector('#mass-name-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);
  host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${massName?'Edit Mass name':'Add Mass name'}</strong><div class="tools"><label>Mass name<input id="mass-name-value" value="${esc(massName?.name||'')}" placeholder="Christmas Eve Vigil"></label><button class="primary" id="save-mass-name">${massName?'Save changes':'Add'}</button><button id="cancel-mass-name" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;
  document.querySelector('#cancel-mass-name').onclick=()=>host.innerHTML='';document.querySelector('#save-mass-name').onclick=async()=>{const name=document.querySelector('#mass-name-value').value.trim();if(!name)return message('Mass name is required.',true);try{await api(massName?`/mass-names/${massName.id}`:`/parishes/${org}/mass-names`,{method:massName?'PATCH':'POST',body:JSON.stringify({name,isActive:massName?.isActive??true})});host.innerHTML='';message(massName?'Mass name updated.':'Mass name added.');renderMassNames()}catch(error){message(error.message,true)}};
}
async function renderMassNames(){
  const org=document.querySelector('#org').value,host=document.querySelector('#mass-name-list');if(!org){host.textContent='Choose a parish to manage Mass names.';return}
  try { const names=(await api(`/parishes/${org}/mass-names`)).sort((a,b)=>a.name.localeCompare(b.name));host.innerHTML=scheduleList(names,n=>scheduleRow(`<strong style="font-size:16px">${esc(n.name)}</strong><div class="muted">${n.isActive?'Available for schedules':'Retired — retained for reporting'}</div>`,`<a href="#" data-edit-mass-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none">Edit →</a><a href="#" data-toggle-mass-name="${n.id}" style="color:#155a9d;font-weight:700;text-decoration:none;margin-left:16px">${n.isActive?'Retire':'Restore'}</a>`))||'<div class="empty">No Mass names have been added.</div>';document.querySelectorAll('[data-edit-mass-name]').forEach(b=>b.onclick=e=>{e.preventDefault();massNameEditor(names.find(n=>n.id===b.dataset.editMassName))});document.querySelectorAll('[data-toggle-mass-name]').forEach(b=>b.onclick=async e=>{e.preventDefault();const n=names.find(n=>n.id===b.dataset.toggleMassName);try{await api(`/mass-names/${n.id}`,{method:'PATCH',body:JSON.stringify({name:n.name,isActive:!n.isActive})});message(n.isActive?'Mass name retired.':'Mass name restored.');renderMassNames()}catch(error){message(error.message,true)}})}catch(error){message(error.message,true)}
}
</script>

<script>
function ampmParts(time){const [rawHour='0',rawMinute='00']=(time||'00:00').split(':');const hour=Number(rawHour),minute=Number(rawMinute);return {hour:hour%12||12,minute:String(minute).padStart(2,'0'),meridiem:hour>=12?'PM':'AM'}}
function displayTime(time){const value=ampmParts(time);return `${value.hour}:${value.minute} ${value.meridiem}`}
function timePicker(id,time=''){const times=Array.from({length:96},(_,index)=>{const minutes=index*15;return `${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`});if(time&&!times.includes(time))times.unshift(time);return `<label>Time<select id="${id}"><option value="" ${time?'':'selected'}>-- Select Time --</option>${times.map(value=>`<option value="${value}" ${value===time?'selected':''}>${displayTime(value)}</option>`).join('')}</select></label>`}
function selectedTime(id){return document.querySelector(`#${id}`).value}
async function recurringEditor(template){const host=document.querySelector('#template-editor'),org=document.querySelector('#org').value;if(!org)return message('Choose a parish.',true);try{const names=await loadMassNameOptions(org,template?.massNameId);if(!names.length){host.innerHTML='<div class="empty">Create a Mass name before adding a recurring Mass.</div>';return}host.innerHTML=`<div style="border:1px solid #dce5ef;border-radius:8px;padding:18px;margin:12px 0"><strong>${template?'Edit recurring Mass':'Add recurring Mass'}</strong><div class="tools">${massNameSelect(names,template?.massNameId)}<label>Day<select id="edit-weekday"><option value="" ${template?'':'selected'}>-- Select Day --</option>${weekdays.map((d,i)=>`<option value="${i}" ${template?.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label>${timePicker('edit-time',template?.serviceTime||'')}<button class="primary" id="save-template">${template?'Save changes':'Add'}</button><button id="cancel-template" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div></div>`;document.querySelector('#cancel-template').onclick=()=>host.innerHTML='';document.querySelector('#save-template').onclick=async()=>{const option=document.querySelector('#mass-name-id').selectedOptions[0],weekday=document.querySelector('#edit-weekday').value,time=selectedTime('edit-time');if(!option.value||weekday===''||!time)return message('Choose a Mass name, day, and time.',true);const payload={massNameId:option.value,name:option.dataset.name,weekday:+weekday,serviceTime:time,isActive:template?.isActive??true,activeFrom:template?.activeFrom,activeTo:template?.activeTo};try{await api(template?`/mass-templates/${template.id}`:`/parishes/${org}/mass-templates`,{method:template?'PATCH':'POST',body:JSON.stringify(payload)});message(template?'Recurring Mass updated.':'Recurring Mass added.');renderRecurringSchedule()}catch(error){message(error.message,true)} <script>
function reportChart(entries){if(!entries.length)return '<div class="empty">No attendance entries for this Mass.</div>';const counts=entries.map(entry=>entry.attendanceCount),minimum=Math.min(...counts),maximum=Math.max(...counts),width=620,height=176,left=40,right=16,top=25,bottom=33,plotWidth=width-left-right,plotHeight=height-top-bottom,point=(entry,index)=>{const x=left+(entries.length===1?plotWidth/2:index*plotWidth/(entries.length-1)),y=top+plotHeight-(entry.attendanceCount-minimum)/Math.max(1,maximum-minimum)*plotHeight;return{x,y}};const points=entries.map(point).map(p=>`${p.x},${p.y}`).join(' ');return `<svg viewBox="0 0 ${width} ${height}" style="display:block;width:100%;max-width:620px;height:auto;margin-top:16px" role="img" aria-label="Attendance trend"><line x1="${left}" y1="${top+plotHeight}" x2="${width-right}" y2="${top+plotHeight}" stroke="#b9c8d8"/><line x1="${left}" y1="${top}" x2="${left}" y2="${top+plotHeight}" stroke="#b9c8d8"/><polyline points="${points}" fill="none" stroke="#176bb0" stroke-width="3"/>${entries.map((entry,index)=>{const p=point(entry,index);return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#176bb0"/><text x="${p.x}" y="${p.y-9}" text-anchor="middle" font-size="11" fill="#17233a">${entry.attendanceCount}</text><text x="${p.x}" y="${height-10}" text-anchor="middle" font-size="10" fill="#5f7189">${displayDate(entry.serviceDate)}</text>`}).join('')}</svg>`}

function reportView(type){const special=type==='special',title=special?'Special Masses':'Recurring Masses';main.innerHTML=`<h1>${title} report</h1><p class="muted">${special?'All special Masses with recorded attendance. Select a row to see its service history.':'Select a recurring Mass to see its service history and attendance trend.'}</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}${special?'':`<label>From<input id="from" type="date" value="${day.slice(0,4)}-01-01"></label><label>To<input id="to" type="date" value="${day}"></label><button class="primary" id="load-report">Load report</button>`}</div><div id="report-list" class="empty">Choose a parish to view the report.</div><div id="report-details"></div>`;wireOrg();const load=()=>loadReportList(type);document.querySelector('#org').onchange=load;if(!special)document.querySelector('#load-report').onclick=load;if(special&&document.querySelector('#org').value)load()}
async function loadReportList(type){const org=document.querySelector('#org').value,list=document.querySelector('#report-list'),details=document.querySelector('#report-details');if(!org){list.textContent='Choose a parish to view the report.';details.innerHTML='';return}const from=type==='special'?'':document.querySelector('#from').value,to=type==='special'?'':document.querySelector('#to').value;if(type==='recurring'&&(!from||!to))return message('Choose a start and end date.',true);try{const params=new URLSearchParams({type});if(from)params.set('from',from);if(to)params.set('to',to);const rows=await api(`/parishes/${org}/reports/mass-attendance?${params}`);list.innerHTML=rows.length?`<div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${rows.map((row,index)=>`<div style="display:grid;grid-template-columns:1fr 100px 105px 24px;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #e7edf4;cursor:pointer" data-report-row="${index}"><div><strong style="font-size:16px">${esc(row.massName)}</strong><div class="muted">${row.servicesCounted} services recorded</div></div><div style="text-align:right">${row.servicesCounted}</div><div style="text-align:right"><strong>${row.averageAttendance}</strong><div class="muted">average</div></div><div style="color:#155a9d;font-size:18px">›</div></div>`).join('')}</div>`:'<div class="empty">No attendance records for this report.</div>';details.innerHTML='';document.querySelectorAll('[data-report-row]').forEach(button=>button.onclick=()=>loadReportDetails(type,rows[+button.dataset.reportRow],from,to))}catch(error){message(error.message,true)}}

</script>

querySelector('#preset-from').value=range.from;document.querySelector('#preset-to').value=range.to}document.querySelector('#custom-range').style.display=custom?'flex':'none';document.querySelector('#selected-range').textContent=all?'All recorded recurring attendance.':custom?'Choose a custom date range.':`Report for: ${displayDate(range.from)} to ${displayDate(range.to)}`;if(!custom&&document.querySelector('#org').value)load()};document.querySelector('#org').onchange=()=>applyPeriod(document.querySelector('#report-period').value);document.querySelector('#report-period').onchange=event=>applyPeriod(event.target.value);document.querySelector('#apply-custom').onclick=()=>{document.querySelector('#preset-from').value=document.querySelector('#from').value;document.querySelector('#preset-to').value=document.querySelector('#to').value;const range=dateFields();if(!range.from||!range.to)return message('Choose a start and end date.',true);document.querySelector('#selected-range').textContent=`Report for: ${displayDate(range.from)} to ${displayDate(range.to)}`;load()};applyPeriod('')};

// The role label and navigation are derived from the assignment for the
// currently active parish; they are not hard-coded UI labels.
let activeRoleLabel;
async function refreshActiveParishIdentity(navigate=false){
  if(!accessToken||!parishSelectionResolved)return;
  try{
    const parishID=activeParishID();
    const identity=await api(`/me${parishID?`?parishId=${encodeURIComponent(parishID)}`:''}`);
    if(parishID!==activeParishID())return;
    canExportReports=(identity.roles||[]).some(item=>item.role==='system_administrator')||(identity.permissions||[]).includes('manage_users');
    const role=identity.roles.find(item=>item.role==='system_administrator')||identity.roles[0];
    if(activeRoleLabel)activeRoleLabel.textContent=role?.roleName||'No application role';
    applyRoleAwareMenu(identity,navigate);
  }catch(_){ /* The login redirect has not completed yet. */ }
}
(function(){
  const header=document.querySelector('header');
  const roleLabel=header.querySelector('#role-label');
  activeRoleLabel=roleLabel;
  const logout=header.querySelector('#logout');
  logout.onclick=async()=>{
    const config=cognitoConfig||await fetch('/auth/config').then(response=>response.json());
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('pkce_verifier');
    location.assign(`https://${config.domain}/logout?${new URLSearchParams({client_id:config.clientId,logout_uri:config.redirectUri})}`);
  };
  const updateRole=async()=>{
	if(!accessToken)return;
    if(!parishSelectionResolved){roleLabel.textContent=parishSelectionRequired?'Choose a Parish':'Loading…';if(parishSelectionRequired)clearInterval(timer);return}
    await refreshActiveParishIdentity(true);
    clearInterval(timer);
  };
  const timer=setInterval(updateRole,300);
  updateRole();
})();
</script><script>
loadWeek=async function(){
  const org=document.querySelector('#org').value,start=attendanceWeekStart(document.querySelector('#week').value),end=plus(start,6);
  if(!org)return message('Choose a parish.',true);
  localStorage.weekStart=start;
  try{
    const services=await api(`/parishes/${org}/attendance-ledger?from=${start}&to=${end}`),host=document.querySelector('#services');
    // The user may have navigated to a report while this ledger request was in flight.
    if(!host)return;
    const weekday=service=>new Date(service.serviceDate+'T12:00:00').getDay();
    const row=service=>`<div class="service ledger" data-date="${service.serviceDate}" data-t="${service.serviceTime}" data-name="${esc(service.massName)}" data-mass-name="${service.massNameId||''}" data-template="${service.massTemplateId||''}" data-special="${service.specialMassId||''}"><div><div class="time">${new Date(service.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${displayTime(service.serviceTime)}</div><div class="muted">${esc(service.massName)}</div></div><input type="number" min="0" value="${service.attendanceCount??''}" placeholder="Count"><span class="saved">${service.attendanceCount!==undefined?'Saved':'Missing'}</span></div>`;
    const group=(title,caption,days)=>{const items=services.filter(service=>days.includes(weekday(service))).sort((a,b)=>days.indexOf(weekday(a))-days.indexOf(weekday(b))||a.serviceTime.localeCompare(b.serviceTime));return items.length?`<h2 style="margin:28px 0 5px;font-size:16px">${title}</h2><p class="muted" style="margin:0 0 9px">${caption}</p><div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${items.map(row).join('')}</div>`:''};
    host.innerHTML=services.length?group('Weekend Masses','Saturday and Sunday',[6,0])+group('Weekday Masses','Monday through Friday',[1,2,3,4,5])+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled Masses in this week.</div>';
    const save=document.querySelector('#save-week');if(save)save.onclick=saveWeek;
  }catch(error){message(error.message,true)}
};
</script><script>
// Keep the navigation aligned with the permissions the server grants. The
// server remains the authority for every API request; this only prevents a
// person from being sent to a page they cannot use.
function applyRoleAwareMenu(identity,navigate=false){
  const permissions=new Set(identity.permissions||[]);
  const isSystem=(identity.roles||[]).some(role=>role.role==='system_administrator');
  const nav=document.querySelector('nav');
  const allowed=permission=>isSystem||permissions.has(permission);
  const show=(selector,visible)=>nav.querySelectorAll(selector).forEach(button=>button.style.display=visible?'':'none');

  show('[data-view="entry"]',allowed('record_attendance'));
  show('[data-view="report"]',allowed('view_reports'));
  show('[data-admin="mass-names"]',allowed('manage_schedules'));
  show('[data-admin="schedules"]',allowed('manage_schedules'));
  show('[data-admin="users"]',allowed('manage_users'));
  show('[data-admin="details"]',isSystem);
  show('[data-admin="parishes"]',isSystem);
  show('[data-admin="billing"]',isSystem);
  show('[data-admin="roles"]',isSystem);
  show('[data-admin="dioceses"]',isSystem);
  document.querySelector('[data-mobile-view="entry"]').style.display=allowed('record_attendance')?'':'none';
  document.querySelector('[data-mobile-view="report"]').style.display=allowed('view_reports')?'':'none';

  [adminMenu,systemAdministrationMenu].forEach(menu=>{
    if(menu)menu.style.display=[...menu.querySelectorAll('button')].some(button=>button.style.display!=='none')?'':'none';
  });

  nav.style.display='';
  nav.querySelectorAll('button').forEach(button=>button.addEventListener('click',closeMobileMenu));
  renderWorkingParishSelector();
  if(!navigate)return;
  if(allowed('record_attendance')){
    view='entry';
    entry();
  }else if(allowed('view_reports')){
    view='report';
    reportView('weekend');
  }else{
    main.innerHTML='<div class="empty">Your account does not have access to a workspace.</div>';
  }
}
</script><script>

// Diocese office details are optional, but keep a canonical contact point for
