dioceseDetails=async function(id){
  adminMenuState('dioceses');
  let diocese={name:'',streetAddress:'',city:'',stateProvince:'',postalCode:'',contactName:'',contactEmail:'',contactPhone:''},parishes=[];
  try{[diocese,parishes]=await Promise.all([id?api(`/dioceses/${id}`):Promise.resolve(diocese),api('/parishes')])}catch(error){main.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
  const assigned=id?parishes.filter(parish=>parish.dioceseId===id):[];
  const field=(label,id,value,type='text',wide=false)=>`<label style="${wide?'grid-column:1/-1;':''}display:grid;gap:6px;font-size:13px;font-weight:700;color:#59677b">${label}<input id="${id}" type="${type}" value="${esc(value||'')}" style="height:37px;border:1px solid #cbd6e4;border-radius:6px;padding:0 10px;font:inherit"></label>`;
  main.innerHTML=`<h1>${id?'Diocese details':'Add Diocese'}</h1><p class="muted">${id?esc(diocese.name):'Enter the name and optional office contact details for the new Diocese.'}</p><div style="display:flex;gap:28px;border-bottom:1px solid #dce4ef;margin:26px 0 24px"><a href="#" id="back-dioceses" style="padding:10px 0;color:#27364d;text-decoration:none">Dioceses</a><span style="padding:10px 0;color:#155a9d;border-bottom:3px solid #176bb0;font-weight:700">Diocese details</span></div><div id="notice" class="notice"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px">${field('Diocese name','diocese-name',diocese.name,'text',true)}${field('Street address','diocese-street',diocese.streetAddress,'text',true)}${field('City','diocese-city',diocese.city)}${field('State / Province','diocese-state',diocese.stateProvince)}${field('Postal code','diocese-postal',diocese.postalCode)}<div></div>${field('Contact name','diocese-contact-name',diocese.contactName)}${field('Contact email','diocese-contact-email',diocese.contactEmail,'email')}${field('Contact phone','diocese-contact-phone',diocese.contactPhone,'tel')}</div><div class="tools"><button class="primary" id="save-diocese">${id?'Save Diocese':'Create Diocese'}</button><button id="cancel-diocese" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button></div>${id?`<div style="margin-top:25px;max-width:900px"><h2 style="font-size:17px;margin-bottom:8px">Parishes in this Diocese</h2>${assigned.length?assigned.map(parish=>`<button data-select-parish="${parish.id}" style="display:grid;grid-template-columns:minmax(0,1fr) 220px 70px;gap:16px;align-items:center;width:100%;padding:13px 14px;margin:7px 0;border:1px solid #dce5ef;border-radius:8px;background:#fff;font:inherit;cursor:pointer;text-align:left"><strong>${esc(parish.name)}</strong><span class="muted">${esc([parish.city,parish.stateProvince].filter(Boolean).join(', '))}</span><span style="color:#155a9d;font-weight:700;text-align:right">Select ›</span></button>`).join(''):'<div class="empty">No Parishes are assigned to this Diocese.</div>'}</div>`:''}`;
  document.querySelector('#back-dioceses').onclick=event=>{event.preventDefault();dioceseList()};
  document.querySelector('#cancel-diocese').onclick=dioceseList;
  document.querySelector('#save-diocese').onclick=async()=>{const payload={name:document.querySelector('#diocese-name').value.trim(),streetAddress:document.querySelector('#diocese-street').value.trim(),city:document.querySelector('#diocese-city').value.trim(),stateProvince:document.querySelector('#diocese-state').value.trim(),postalCode:document.querySelector('#diocese-postal').value.trim(),contactName:document.querySelector('#diocese-contact-name').value.trim(),contactEmail:document.querySelector('#diocese-contact-email').value.trim(),contactPhone:document.querySelector('#diocese-contact-phone').value.trim()};if(!payload.name)return message('Diocese name is required.',true);try{await api(id?`/dioceses/${id}`:'/dioceses',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});dioceseList()}catch(error){message(error.message,true)}};
  main.querySelectorAll('[data-select-parish]').forEach(button=>button.onclick=()=>{parishSelectionResolved=true;setActiveParish(button.dataset.selectParish);refreshActiveParishIdentity(true)});
};

// Subscription status belongs in the billing list so an administrator can see

function updateWeeklyAttendanceTotal(){
  const total=[...document.querySelectorAll('.ledger input')].reduce((sum,input)=>{
    const value=input.value.trim();
    return sum+(value===''?0:Number(value)||0);
  },0);
  const totalElement=document.querySelector('#weekly-attendance-total');
  if(totalElement)totalElement.textContent=total.toLocaleString();
}

function markWeeklyAttendanceChanged(input){
  const row=input.closest('.ledger');
  if(!row)return;
  row.dataset.changed=input.value!==input.dataset.savedValue?'true':'';
  const status=row.querySelector('.saved');
  if(status)status.textContent='';
  updateWeeklyAttendanceTotal();
}

entry=async function(){
  document.querySelectorAll('nav button').forEach(button=>button.classList.remove('active'));
  document.querySelector('[data-view="entry"]')?.classList.add('active');
  view='entry';
  const selectedDate=localStorage.attendanceDate||day,start=attendanceWeekStart(selectedDate);
  main.innerHTML=`<h1>Attendance entry</h1><p class="muted">Choose any date to load the next Saturday through Friday attendance week.</p><div class="attendance-week-nav">${selectHTML()}<button class="week-jump" id="previous-week" type="button" aria-label="Previous week">← <span>Previous week</span></button><label>Go to date<input id="go-date" type="date" value="${selectedDate}"></label><button class="week-jump" id="next-week" type="button" aria-label="Next week"><span>Next week</span> →</button></div><input id="week" type="hidden" value="${start}"><div class="weekly-summary"><div id="week-label" style="font-size:16px;font-weight:700;padding-top:7px">${attendanceWeekLabel(start)}</div><div class="weekly-total"><strong id="weekly-attendance-total" class="average">0</strong><div class="muted">weekly total attendance</div></div></div><div id="notice" class="notice"></div><div id="services" class="empty">Choose a parish, then select a date.</div>`;
  wireOrg();
  const dateInput=document.querySelector('#go-date');
  const loadSelectedDate=()=>{
    const value=dateInput.value;
    if(!value)return message('Choose a date.',true);
    localStorage.attendanceDate=value;
    const week=attendanceWeekStart(value);
    document.querySelector('#week').value=week;
    document.querySelector('#week-label').textContent=attendanceWeekLabel(week);
    loadWeek();
  };
  dateInput.onchange=loadSelectedDate;
  document.querySelector('#previous-week').onclick=()=>{dateInput.value=plus(dateInput.value,-7);loadSelectedDate()};
  document.querySelector('#next-week').onclick=()=>{dateInput.value=plus(dateInput.value,7);loadSelectedDate()};
  if(document.querySelector('#org').value)loadWeek();
};

loadWeek=async function(){
  const org=document.querySelector('#org').value,start=attendanceWeekStart(document.querySelector('#week').value),end=plus(start,6);
  if(!org)return message('Choose a parish.',true);
  localStorage.weekStart=start;
  try{
    const services=await api(`/parishes/${org}/attendance-ledger?from=${start}&to=${end}`),host=document.querySelector('#services');
    // Do not render a completed ledger request into a report page.
    if(!host)return;
    const weekday=service=>new Date(service.serviceDate+'T12:00:00').getDay();
    const row=service=>{const count=service.attendanceCount??'';return `<div class="service ledger" data-date="${service.serviceDate}" data-t="${service.serviceTime}" data-name="${esc(service.massName)}" data-mass-name="${service.massNameId||''}" data-template="${service.massTemplateId||''}" data-special="${service.specialMassId||''}"><div><div class="time">${new Date(service.serviceDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${displayTime(service.serviceTime)}</div><div class="muted">${esc(service.massName)}</div></div><input type="number" min="0" value="${count}" data-saved-value="${count}" placeholder="Count"><span class="saved"></span></div>`};
    const group=(title,caption,days)=>{const items=services.filter(service=>days.includes(weekday(service))).sort((a,b)=>days.indexOf(weekday(a))-days.indexOf(weekday(b))||a.serviceTime.localeCompare(b.serviceTime));return items.length?`<h2 style="margin:28px 0 5px;font-size:16px">${title}</h2><p class="muted" style="margin:0 0 9px">${caption}</p><div style="border:1px solid #dce5ef;border-radius:8px;overflow:hidden">${items.map(row).join('')}</div>`:''};
    host.innerHTML=services.length?group('Weekend Masses','Saturday and Sunday',[6,0])+group('Weekday Masses','Monday through Friday',[1,2,3,4,5])+`<div class="tools"><button class="primary" id="save-week">Save attendance</button></div>`:'<div class="empty">No scheduled Masses in this week.</div>';
    document.querySelectorAll('.ledger input').forEach(input=>input.oninput=()=>markWeeklyAttendanceChanged(input));
    const save=document.querySelector('#save-week');if(save)save.onclick=saveWeek;
    updateWeeklyAttendanceTotal();
  }catch(error){message(error.message,true)}
};

saveWeek=async function(){
  const org=document.querySelector('#org').value;
  const rows=[...document.querySelectorAll('.ledger')].filter(row=>row.dataset.changed==='true'&&row.querySelector('input').value!=='');
  if(!rows.length)return message('No attendance changes to save.');
  try{
    await Promise.all(rows.map(row=>api(`/parishes/${org}/attendance`,{method:'POST',body:JSON.stringify({serviceDate:row.dataset.date,serviceTime:row.dataset.t,massName:row.dataset.name,massNameId:row.dataset.massName||undefined,massTemplateId:row.dataset.template||undefined,specialMassId:row.dataset.special||undefined,attendanceCount:+row.querySelector('input').value})})));
    rows.forEach(row=>{const input=row.querySelector('input'),status=row.querySelector('.saved');input.dataset.savedValue=input.value;row.dataset.changed='';if(status)status.textContent='Saved'});
    message('Attendance saved.');
  }catch(error){message(error.message,true)}
};

async function refreshConfiguredReportMenu(){
  const org=activeParishID();
  if(!org)return;
  try{
    const [templates,specialMasses]=await Promise.all([api(`/parishes/${org}/mass-templates`),api(`/parishes/${org}/special-masses`)]);
    const configured={weekend:templates.some(template=>template.weekday===0||template.weekday===6),weekday:templates.some(template=>template.weekday>=1&&template.weekday<=5),special:specialMasses.some(mass=>mass.action==='ADD')};
    configuredReportButtons.forEach(button=>button.style.display=configured[button.dataset.reportType]?'':'none');
    reportsMenu.style.display=Object.values(configured).some(Boolean)?'':'none';
  }catch(_){/* The report itself will show any API error. */}
}
const configuredReportsSetActiveParish=setActiveParish;

function reportDateOptions(type){
  const recurring=type==='weekend'||type==='weekday';
  return `<option value="all">All Recorded Attendance</option>${recurring?'<option value="30">Last 30 days</option><option value="60">Last 60 days</option><option value="month">Current month</option><option value="year">Current year</option>':''}<option value="custom">Custom range</option>`;
}
function reportTitle(type){return ({weekend:'Weekend Masses',weekday:'Weekday Masses',special:'Special Masses'})[type]}
function reportAllLabel(type){return `All ${reportTitle(type)}`}
function reportDateRange(type,period){return period==='all'?{from:'',to:''}:period==='custom'?{from:document.querySelector('#report-from').value,to:document.querySelector('#report-to').value}:recurringReportRange(period)}
function csvCell(value){return `"${String(value).replaceAll('"','""')}"`}

reportView=function(type){
  document.querySelectorAll('nav button').forEach(button=>button.classList.remove('active'));
  document.querySelector(`[data-report-type="${type}"]`)?.classList.add('active');
  view='report';
  const title=reportTitle(type),recurring=type==='weekend'||type==='weekday';
  main.innerHTML=`<h1>${title} report</h1><p class="muted">Attendance averages for ${type==='weekend'?'configured Saturday and Sunday':type==='weekday'?'configured Monday through Friday':'configured special'} Masses.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>Report date<select id="configured-report-period">${reportDateOptions(type)}</select></label><div id="report-mass-picker"><label>Mass name<button id="report-mass-trigger" type="button" aria-expanded="false" aria-controls="report-mass-options"><span>${reportAllLabel(type)}</span><span class="mass-picker-chevron" aria-hidden="true"></span></button></label><div id="report-mass-options" class="mass-options"></div></div>${canExportReports?'<div id="report-export-control" style="position:relative;align-self:end"><button class="primary" id="report-export" type="button" disabled aria-expanded="false" aria-controls="report-export-options">Export ▾</button><div id="report-export-options" class="report-export-menu"><button type="button" data-export="csv"><strong>CSV spreadsheet</strong><small>Exports the Masses listed below</small></button><button type="button" data-export="print"><strong>Print / Save as PDF</strong><small>Prints the Masses listed below</small></button></div></div>':''}</div><div id="report-custom-range" class="tools" style="display:none;margin-top:8px"><label>From<input id="report-from" type="date"></label><label>To<input id="report-to" type="date"></label><button class="primary" id="apply-report-range">Apply</button></div><div id="report-selected-range" class="muted" style="margin:10px 0">All recorded ${title.toLowerCase()} attendance.</div><div id="report-list" class="empty">Loading report…</div>`;
  wireOrg();
  const state={rows:[],selected:null,type};
  const list=document.querySelector('#report-list'),period=document.querySelector('#configured-report-period'),picker=document.querySelector('#report-mass-options'),trigger=document.querySelector('#report-mass-trigger'),rangeText=document.querySelector('#report-selected-range');

// Keep the browser-side checks aligned with the Cognito password policy.
// This also supports invited users who choose an 8–11 character password.
let passwordPolicyChallengeSession='';
const passwordPolicyAuthPost=authPost;
authPost=async function(path,payload){const result=await passwordPolicyAuthPost(path,payload);if(path==='/auth/sign-in'&&result.challenge==='new_password')passwordPolicyChallengeSession=result.session;return result};
const meetsPasswordPolicy=password=>password.length>=8&&/[a-z]/.test(password)&&/[A-Z]/.test(password)&&/[0-9]/.test(password)&&/[^A-Za-z0-9]/.test(password);
const updatePasswordPolicyCopy=()=>{const portal=document.querySelector('#auth-portal'),password=portal?.querySelector('#auth-password'),confirmation=portal?.querySelector('#auth-password-confirm');if(!password||!confirmation)return;const help=portal.querySelector('#auth-password-help'),match=portal.querySelector('#auth-password-match');if(help){help.textContent=password.value&&meetsPasswordPolicy(password.value)?'✓ Password requirements met.':'Use at least 8 characters, including an uppercase letter, lowercase letter, number, and symbol.';help.style.color=password.value&&meetsPasswordPolicy(password.value)?'#176344':'#627287'}if(match&&confirmation.value){match.textContent=password.value===confirmation.value?'✓ Passwords match':'Passwords do not match.';match.style.color=password.value===confirmation.value?'#176344':'#a22b34'}};
new MutationObserver(updatePasswordPolicyCopy).observe(document.body,{childList:true,subtree:true});
document.addEventListener('input',event=>{if(event.target.matches('#auth-password,#auth-password-confirm'))setTimeout(updatePasswordPolicyCopy,0)},true);
document.addEventListener('submit',async event=>{const form=event.target;if(form.id!=='auth-form')return;const portal=form.closest('#auth-portal'),password=portal?.querySelector('#auth-password'),confirmation=portal?.querySelector('#auth-password-confirm');if(!password||!confirmation||password.value.length>=12)return;if(!meetsPasswordPolicy(password.value)||password.value!==confirmation.value)return;event.preventDefault();event.stopImmediatePropagation();const status=portal.querySelector('#auth-status'),showError=text=>{status.textContent=text;status.style.display='block'};try{const email=portal.querySelector('#auth-email').value.trim(),code=portal.querySelector('#auth-code');if(code){await authPost('/auth/password-reset/confirm',{email,code:code.value.trim(),password:password.value});location.reload();return}const result=await authPost('/auth/new-password',{email,password:password.value,session:passwordPolicyChallengeSession});sessionStorage.setItem('access_token',result.accessToken);location.reload()}catch(error){showError(error.message)}},true);
updatePasswordPolicyCopy();

  const permissionBadgeLabels={record_attendance:'Attendance',view_reports:'View Reports',manage_schedules:'Schedules',manage_users:'Users'};
  const permissionSummary=role=>[...Object.keys(permissionBadgeLabels).filter(key=>role.isSystem||role.permissions.includes(key)).map(key=>permissionBadgeLabels[key]),...(role.isSystem?['System Administration']:[])];
  const renderEditor=role=>{const system=role.isSystem,assigned=parishAssignments(role),permissions=role.permissions||[],showAll=expandedParishes.has(role.id),visible=showAll?assigned:assigned.slice(0,3),systemPermission=system?'<label><span>System Administration<small style="display:block;margin-top:2px;font-weight:400">Manage parishes, dioceses, billing, and roles</small></span><input type="checkbox" checked disabled></label>':'',newRole=role.id==='new';return `<div class="role-card-editor"><div class="role-editor-grid"><section><h2>${system?'System Administrator details':newRole?'Add role':'Edit role'}</h2><label>Role name<input id="role-name" type="text" value="${esc(role.name||'')}" ${system?'disabled':''}></label><div class="role-permission-list">${Object.entries(permissionLabels).map(([permission,label])=>`<label>${label}<input type="checkbox" data-permission="${permission}" ${permissions.includes(permission)||system?'checked':''} ${system?'disabled':''}></label>`).join('')}${systemPermission}</div></section><section><h2>Assigned users by parish</h2>${system?`<p class="muted">${role.assignmentCount} system user${role.assignmentCount===1?'':'s'} can access every parish.</p>`:assigned.length?`${visible.map(item=>`<div class="role-parish-assignment"><div><strong>${esc(item.name)}</strong><small>${item.count} assigned user${item.count===1?'':'s'}</small></div><span class="role-parish-count">${item.count} user${item.count===1?'':'s'}</span><button class="role-manage-users" data-manage-parish="${item.parishID}">Manage users →</button></div>`).join('')}${assigned.length>3?`<button class="role-show-all" data-toggle-parishes="${role.id}">${showAll?'Show fewer parishes':'Show all '+assigned.length+' parishes'}</button>`:''}`:'<p class="muted">No parish users are assigned to this role yet.</p>'}</section></div>${system?'':`<div class="role-actions"><button class="primary" id="save-role">Save changes</button>${newRole?'<button id="cancel-role" style="height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit">Cancel</button>':'<button id="delete-role" style="height:37px;border:1px solid #c4696e;background:#fff;color:#9d3039;border-radius:6px;padding:0 14px;font:inherit">Delete role</button>'}</div>`}</div>`};
  const render=()=>{main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h1>Roles</h1><p class="muted">Set permissions once, then see where each role is assigned.</p></div><button class="primary" id="add-role">Add role</button></div><div id="notice" class="notice"></div><div id="roles-workspace">${roles.map(role=>`<article class="role-card"><button class="role-summary" data-role-id="${role.id}"><span><strong>${esc(role.name)}${role.isSystem?' · Locked':''}</strong><span class="muted" style="display:block;margin-top:3px">${role.isSystem?'Built-in full application access. Select to view details.':'Parish-scoped role.'}</span></span><span class="role-permissions">${permissionSummary(role).map(permission=>`<span class="role-permission-summary">${esc(permission)}</span>`).join('')}</span><span class="role-assignment-summary">${summary(role)}</span><span class="role-chevron">${openRoleID===role.id?'⌃':'⌄'}</span></button>${openRoleID===role.id?renderEditor(role):''}</article>`).join('')}</div>`;if(!roles.length)document.querySelector('#roles-workspace').innerHTML='<div class="empty">No roles created.</div>';document.querySelectorAll('[data-role-id]').forEach(button=>button.onclick=()=>{openRoleID=openRoleID===button.dataset.roleId?'':button.dataset.roleId;render()});document.querySelector('#add-role').onclick=()=>{const draft={id:'new',name:'',permissions:[],assignmentCount:0,isSystem:false};roles=[draft,...roles];openRoleID='new';render()};document.querySelectorAll('[data-toggle-parishes]').forEach(button=>button.onclick=()=>{const id=button.dataset.toggleParishes;expandedParishes.has(id)?expandedParishes.delete(id):expandedParishes.add(id);render()});document.querySelectorAll('[data-manage-parish]').forEach(button=>button.onclick=()=>{setActiveParish(button.dataset.manageParish);userAccessPage()});const cancel=document.querySelector('#cancel-role');if(cancel)cancel.onclick=()=>{roles=roles.filter(role=>role.id!=='new');openRoleID='';render()};const save=document.querySelector('#save-role');if(save)save.onclick=async()=>{const role=roles.find(item=>item.id===openRoleID),payload={name:document.querySelector('#role-name').value.trim(),permissions:[...document.querySelectorAll('[data-permission]:checked')].map(input=>input.dataset.permission)};if(!payload.name)return message('Role name is required.',true);try{const saved=await api(role.id==='new'?'/roles':`/roles/${role.id}`,{method:role.id==='new'?'POST':'PATCH',body:JSON.stringify(payload)});roles=roles.map(item=>item.id===role.id?saved:item);openRoleID=saved.id;render()}catch(error){message(error.message,true)}};const remove=document.querySelector('#delete-role');if(remove)remove.onclick=async()=>{const role=roles.find(item=>item.id===openRoleID);if(role.assignmentCount>0)return message('Reassign or remove users before deleting this role.',true);if(!confirm('Delete this role?'))return;try{await api(`/roles/${role.id}`,{method:'DELETE'});roles=roles.filter(item=>item.id!==role.id);openRoleID='';render()}catch(error){message(error.message,true)}}};
  render();
};
// Add an explicit escape route alongside every administrative save action.
// The detail forms are rendered dynamically, so observe the main content area
// and attach the appropriate return action when one is displayed.
const addAdministrationCancelButtons=()=>{
  const actions=[
    {save:'save-details',cancel:'cancel-parish-details',label:'Cancel',back:parishList},
    {save:'save-diocese',cancel:'cancel-diocese',label:'Cancel',back:dioceseList},
    {save:'save-billing-account',cancel:'cancel-billing-account-details',label:'Cancel',back:billingAccountsPage}
  ];
  actions.forEach(({save,cancel,label,back})=>{
    const saveButton=document.querySelector(`#${save}`);
    if(!saveButton||document.querySelector(`#${cancel}`))return;
    const cancelButton=document.createElement('button');
    cancelButton.id=cancel;
    cancelButton.type='button';
    cancelButton.textContent=label;
    cancelButton.style.cssText='height:37px;border:1px solid #cbd6e4;background:#fff;border-radius:6px;padding:0 14px;font:inherit';
    cancelButton.onclick=back;
    saveButton.insertAdjacentElement('afterend',cancelButton);
  });
};
new MutationObserver(addAdministrationCancelButtons).observe(main,{childList:true,subtree:true});
addAdministrationCancelButtons();

// A compact operational report: one total for each Saturday–Sunday weekend
// and one grand total for the selected date range.
function legacyWeekendTotalsReport(){
  document.querySelectorAll('nav button').forEach(button=>button.classList.remove('active'));
  document.querySelector('[data-report-type="weekend-totals"]')?.classList.add('active');
  view='report';
  const currentMonthStart=`${day.slice(0,8)}01`;
  main.innerHTML=`<h1>Weekend totals report</h1><p class="muted">Recorded recurring Saturday and Sunday Mass attendance, grouped by weekend.</p><div id="notice" class="notice"></div><div class="tools">${selectHTML()}<label>From<input id="weekend-totals-from" type="date" value="${currentMonthStart}"></label><label>To<input id="weekend-totals-to" type="date" value="${day}"></label><button class="primary" id="run-weekend-totals">Run report</button><button id="export-weekend-totals" type="button" disabled style="height:37px;border:1px solid #176bb0;background:#fff;color:#155a9d;border-radius:6px;padding:0 14px;font:inherit;font-weight:700">Export CSV</button></div><div id="weekend-totals-range" class="muted" style="margin:10px 0"></div><div id="weekend-totals-list" class="empty">Choose a parish and run the report.</div>`;
  wireOrg();
  const range=()=>({from:document.querySelector('#weekend-totals-from').value,to:document.querySelector('#weekend-totals-to').value});
  let rows=[];
  const render=()=>{const list=document.querySelector('#weekend-totals-list'),{from,to}=range(),total=rows.reduce((sum,row)=>sum+row.attendanceTotal,0);document.querySelector('#weekend-totals-range').textContent=`Report for: ${displayDate(from)} to ${displayDate(to)}`;list.innerHTML=rows.length?`<table><thead><tr><th>Weekend</th><th style="text-align:right">Total attendance</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(displayDate(row.weekendStart))} – ${esc(displayDate(row.weekendEnd))}</td><td style="text-align:right;font-weight:700">${row.attendanceTotal.toLocaleString()}</td></tr>`).join('')}</tbody><tfoot><tr><th>Selected-range total</th><th style="text-align:right;font-size:17px">${total.toLocaleString()}</th></tr></tfoot></table>`:'<div class="empty">No recorded weekend attendance in this period.</div>';document.querySelector('#export-weekend-totals').disabled=!rows.length};
  document.querySelector('#run-weekend-totals').onclick=async()=>{const org=document.querySelector('#org').value,{from,to}=range();if(!org)return message('Choose a parish.',true);if(!from||!to)return message('Choose a start and end date.',true);if(from>to)return message('The start date must be on or before the end date.',true);try{rows=await api(`/parishes/${org}/reports/weekend-totals?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);render()}catch(error){message(error.message,true)}};
  document.querySelector('#export-weekend-totals').onclick=()=>{const total=rows.reduce((sum,row)=>sum+row.attendanceTotal,0),lines=[['Weekend start','Weekend end','Total attendance'].map(csvCell).join(','),...rows.map(row=>[row.weekendStart,row.weekendEnd,row.attendanceTotal].map(csvCell).join(',')),['Selected-range total','',total].map(csvCell).join(',')],link=document.createElement('a'),blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});link.href=URL.createObjectURL(blob);link.download=`weekend-totals-${range().from}-to-${range().to}.csv`;link.click();URL.revokeObjectURL(link.href)};
}

// Install this report after the legacy report customizations have finished.
setTimeout(()=>{
  const existingReportView=reportView;
  reportView=function(type){return type==='weekend-totals'?weekendTotalsReport():existingReportView(type)};

  reportsMenu.querySelectorAll('[data-report-type]').forEach(button=>button.onclick=()=>reportView(button.dataset.reportType));
